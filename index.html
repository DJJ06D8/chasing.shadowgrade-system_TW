<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS GRADE // 國二-2 智慧成績系統</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-base: #060913;
      --bg-glow-1: rgba(0, 240, 255, 0.12);
      --bg-glow-2: rgba(16, 185, 129, 0.12);
      --grid-line: rgba(0, 240, 255, 0.035);
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(0, 240, 255, 0.25);
      --card-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      --accent-primary: #00f0ff;
      --accent-blue: #38bdf8;
      --title-grad: linear-gradient(90deg, #ffffff, #38bdf8);
      --text-main: #f8fafc;
      --text-label: #cbd5e1;
      --text-muted: #94a3b8;
      --input-bg: rgba(2, 6, 23, 0.78);
      --input-border: rgba(148, 163, 184, 0.35);
      --input-text: #ffffff;
      --btn-grad: linear-gradient(135deg, #00f0ff 0%, #10b981 100%);
      --btn-text: #020617;
      --toggle-bg: rgba(15, 23, 42, 0.75);
      --toggle-border: rgba(0, 240, 255, 0.35);
      --toggle-text: #e2e8f0;
    }

    [data-theme="light"] {
      --bg-base: #eef3f9;
      --bg-glow-1: rgba(2, 132, 199, 0.12);
      --bg-glow-2: rgba(16, 185, 129, 0.1);
      --grid-line: rgba(14, 116, 144, 0.065);
      --card-bg: rgba(255, 255, 255, 0.9);
      --card-border: rgba(2, 132, 199, 0.25);
      --card-shadow: 0 20px 50px rgba(15, 23, 42, 0.09);
      --accent-primary: #0284c7;
      --accent-blue: #0369a1;
      --title-grad: linear-gradient(90deg, #0f172a, #0284c7);
      --text-main: #0f172a;
      --text-label: #334155;
      --text-muted: #475569;
      --input-bg: #f8fafc;
      --input-border: rgba(148, 163, 184, 0.45);
      --input-text: #0f172a;
      --btn-grad: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
      --btn-text: #ffffff;
      --toggle-bg: rgba(255, 255, 255, 0.9);
      --toggle-border: rgba(2, 132, 199, 0.3);
      --toggle-text: #0f172a;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 15% 20%, var(--bg-glow-1) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, var(--bg-glow-2) 0%, transparent 45%),
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      color: var(--text-main);
      padding: 1.5rem;
    }

    .login-card {
      width: 100%;
      max-width: 430px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 2.25rem;
      box-shadow: var(--card-shadow);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .sys-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      color: var(--accent-primary);
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    .theme-btn {
      background: var(--toggle-bg);
      color: var(--toggle-text);
      border: 1px solid var(--toggle-border);
      padding: 0.35rem 0.75rem;
      border-radius: 8px;
      cursor: pointer;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.75rem;
      font-weight: 700;
    }

    h1 {
      margin: 0 0 0.45rem 0;
      font-size: 1.55rem;
      background: var(--title-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.86rem;
      color: var(--text-muted);
      margin-bottom: 1.75rem;
      line-height: 1.5;
    }

    .form-group { margin-bottom: 1.25rem; }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-label);
      margin-bottom: 0.45rem;
    }

    input {
      width: 100%;
      padding: 0.75rem 0.95rem;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: var(--input-text);
      font-size: 0.98rem;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 12px var(--bg-glow-1);
    }

    .hint-box {
      background: rgba(2, 132, 199, 0.08);
      border: 1px solid rgba(2, 132, 199, 0.25);
      border-radius: 10px;
      padding: 0.75rem 0.95rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1.35rem;
      line-height: 1.55;
    }
    .hint-box strong { color: var(--accent-primary); }

    .login-btn {
      width: 100%;
      padding: 0.9rem;
      background: var(--btn-grad);
      color: var(--btn-text);
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    #msg {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 600;
      min-height: 1.25rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="top-bar">
      <span class="sys-tag">NEXUS GRADE // ACCESS PORTAL</span>
      <button class="theme-btn" onclick="toggleTheme()">
        <span id="themeText">LIGHT</span>
      </button>
    </div>

    <h1>國二-2 智慧成績系統</h1>
    <p class="subtitle">請輸入專屬帳號與密碼登入查看學習數據與全班組距分布</p>

    <div class="form-group">
      <label for="accountInput">登入帳號（學號 / 家長帳號 / 老師帳號）</label>
      <input type="text" id="accountInput" placeholder="學生填學號；家長填 F＋學號" autocomplete="username">
    </div>

    <div class="form-group">
      <label for="passwordInput">登入密碼</label>
      <input type="password" id="passwordInput" placeholder="預設密碼為 123456" autocomplete="current-password" onkeydown="if(event.key==='Enter') handleLogin()">
    </div>

    <div class="hint-box">
      • <strong>學生登入：</strong>直接輸入學號（例如 <code>1410101</code>）<br>
      • <strong>家長登入：</strong>輸入 <code>F</code> ＋ 孩子學號（例如 <code>F1410101</code>，大小寫皆可）<br>
      • 首次登入預設密碼皆為 <code>123456</code>，登入後可自行修改
    </div>

    <button class="login-btn" id="loginBtn" onclick="handleLogin()">登入系統終端</button>
    <div id="msg"></div>
  </div>

  <script>
    function applyTheme(theme) {
      const toggleText = document.getElementById('themeText');
      if (theme === 'light') {
        document.documentElement.setAttribute('data-theme', 'light');
        if (toggleText) toggleText.innerText = 'DARK';
      } else {
        document.documentElement.removeAttribute('data-theme');
        if (toggleText) toggleText.innerText = 'LIGHT';
      }
    }
    function toggleTheme() {
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      localStorage.setItem('nexus-theme', next);
      applyTheme(next);
    }
    applyTheme(localStorage.getItem('nexus-theme') || 'dark');

    const SUPABASE_URL = 'https://udtaqnkdohkfzkyzkmwd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Y_GZnXSJAUmTEPvTR-jX0Q_og4LybPV';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const SCHOOL_DOMAIN = 'cysh.khc.edu.tw';

    async function redirectByRole(userId) {
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', userId)
        .single();

      if (!profile) return;
      if (profile.role === 'admin') window.location.href = 'admin.html';
      else if (profile.role === 'parent') window.location.href = 'parent.html';
      else window.location.href = 'student.html';
    }

    (async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session) await redirectByRole(session.user.id);
    })();

    async function handleLogin() {
      const rawAccount = document.getElementById('accountInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const msgEl = document.getElementById('msg');
      const btn = document.getElementById('loginBtn');

      if (!rawAccount || !password) {
        msgEl.style.color = '#f43f5e';
        msgEl.innerText = '請輸入帳號與密碼！';
        return;
      }

      const email = rawAccount.includes('@')
        ? rawAccount.toLowerCase()
        : `${rawAccount.toLowerCase()}@${SCHOOL_DOMAIN}`;

      btn.disabled = true;
      msgEl.style.color = 'var(--accent-blue)';
      msgEl.innerText = '正在驗證身分權限...';

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      btn.disabled = false;

      if (error) {
        msgEl.style.color = '#f43f5e';
        msgEl.innerText = '帳號或密碼錯誤，請重新確認！';
        return;
      }

      msgEl.style.color = '#10b981';
      msgEl.innerText = '✓ 驗證成功，正在進入專屬終端...';
      await redirectByRole(data.user.id);
    }
  </script>
</body>
</html>
