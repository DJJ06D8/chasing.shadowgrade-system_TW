<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS GRADE // 國二-2 智慧成績系統</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-base: #060913;
      --bg-glow-1: rgba(0, 240, 255, 0.12);
      --bg-glow-2: rgba(16, 185, 129, 0.12);
      --grid-line: rgba(0, 240, 255, 0.035);
      --card-bg: rgba(15, 23, 42, 0.85);
      --card-border: rgba(0, 240, 255, 0.25);
      --card-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
      --accent-primary: #00f0ff;
      --accent-blue: #38bdf8;
      --accent-emerald: #10b981;
      --accent-gold: #fbbf24;
      --title-grad: linear-gradient(90deg, #ffffff, #38bdf8);
      --text-main: #f8fafc;
      --text-label: #cbd5e1;
      --text-muted: #94a3b8;
      --input-bg: rgba(2, 6, 23, 0.78);
      --input-border: rgba(148, 163, 184, 0.35);
      --input-text: #ffffff;
      --btn-grad: linear-gradient(135deg, #00f0ff 0%, #10b981 100%);
      --btn-text: #020617;
      --pill-bg: rgba(2, 6, 23, 0.85);
      --pill-border: rgba(0, 240, 255, 0.4);
      --pill-knob: linear-gradient(135deg, #00f0ff, #38bdf8);
      --pill-knob-shadow: 0 0 10px rgba(0, 240, 255, 0.75);
      --ann-item-bg: rgba(2, 6, 23, 0.6);
      --ann-item-border: rgba(148, 163, 184, 0.2);
    }

    [data-theme="light"] {
      --bg-base: #eef3f9;
      --bg-glow-1: rgba(2, 132, 199, 0.12);
      --bg-glow-2: rgba(16, 185, 129, 0.1);
      --grid-line: rgba(14, 116, 144, 0.065);
      --card-bg: rgba(255, 255, 255, 0.92);
      --card-border: rgba(2, 132, 199, 0.25);
      --card-shadow: 0 20px 50px rgba(15, 23, 42, 0.09);
      --accent-primary: #0284c7;
      --accent-blue: #0369a1;
      --accent-emerald: #059669;
      --accent-gold: #d97706;
      --title-grad: linear-gradient(90deg, #0f172a, #0284c7);
      --text-main: #0f172a;
      --text-label: #334155;
      --text-muted: #475569;
      --input-bg: #f8fafc;
      --input-border: rgba(148, 163, 184, 0.45);
      --input-text: #0f172a;
      --btn-grad: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
      --btn-text: #ffffff;
      --pill-bg: #e2e8f0;
      --pill-border: rgba(2, 132, 199, 0.38);
      --pill-knob: linear-gradient(135deg, #f59e0b, #fbbf24);
      --pill-knob-shadow: 0 0 10px rgba(245, 158, 11, 0.65);
      --ann-item-bg: rgba(248, 250, 252, 0.95);
      --ann-item-border: rgba(148, 163, 184, 0.3);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      background-image: 
        radial-gradient(circle at 15% 20%, var(--bg-glow-1) 0%, transparent 45%),
        radial-gradient(circle at 85% 80%, var(--bg-glow-2) 0%, transparent 45%),
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      color: var(--text-main);
      padding: 1.25rem;
      transition: background-color 0.35s ease, color 0.35s ease;
      overflow-x: hidden;
    }

    #bootSplash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      background: var(--bg-base);
      background-image:
        radial-gradient(circle at 50% 45%, var(--bg-glow-1) 0%, transparent 55%),
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 100% 100%, 30px 30px, 30px 30px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      transition: opacity 0.45s ease, visibility 0.45s ease;
    }

    #bootSplash.fade-out {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-core {
      text-align: center;
      padding: 1.5rem;
    }

    .splash-ring {
      width: 56px;
      height: 56px;
      margin: 0 auto 1rem auto;
      border-radius: 50%;
      border: 2.5px solid rgba(0, 240, 255, 0.18);
      border-top-color: var(--accent-primary);
      border-right-color: var(--accent-emerald);
      animation: spinRing 0.9s linear infinite;
    }

    .splash-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.78rem;
      letter-spacing: 0.2em;
      color: var(--accent-primary);
      font-weight: 700;
      margin-bottom: 0.4rem;
    }

    .splash-title {
      font-size: 1.5rem;
      font-weight: 800;
      background: var(--title-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 1rem;
    }

    .splash-bar-track {
      width: 220px;
      height: 4px;
      background: rgba(148, 163, 184, 0.2);
      border-radius: 999px;
      margin: 0 auto;
      overflow: hidden;
    }

    .splash-bar-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-primary), var(--accent-emerald));
      border-radius: 999px;
      animation: loadBar 0.7s ease forwards;
    }

    @keyframes spinRing { to { transform: rotate(360deg); } }
    @keyframes loadBar { to { width: 100%; } }

    .portal-wrapper {
      width: 100%;
      max-width: 960px;
      display: grid;
      grid-template-columns: 1.1fr 0.95fr;
      gap: 1.75rem;
      align-items: stretch;
      opacity: 0;
      transform: translateY(12px);
      transition: opacity 0.45s ease, transform 0.45s ease;
    }

    @media (max-width: 820px) {
      body {
        align-items: flex-start;
        padding: 1rem 0.85rem 2rem 0.85rem;
      }
      .portal-wrapper {
        display: flex;
        flex-direction: column-reverse;
        max-width: 480px;
        gap: 1.25rem;
      }
      .panel-card { padding: 1.5rem 1.25rem !important; }
      h1, h2 { font-size: 1.32rem !important; }
      .ann-list { max-height: 300px !important; }
    }

    .portal-wrapper.card-ready {
      opacity: 1;
      transform: translateY(0);
    }

    .panel-card {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 2rem;
      box-shadow: var(--card-shadow);
      display: flex;
      flex-direction: column;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
      gap: 0.5rem;
    }

    .sys-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.72rem;
      color: var(--accent-primary);
      letter-spacing: 0.12em;
      font-weight: 700;
    }

    .theme-switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 78px;
      height: 30px;
      padding: 3px;
      border-radius: 999px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }

    .theme-switch-knob {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: var(--pill-knob);
      box-shadow: var(--pill-knob-shadow);
      transform: translateX(0);
      transition: transform 0.3s ease;
      flex-shrink: 0;
    }

    [data-theme="light"] .theme-switch-knob { transform: translateX(48px); }

    .theme-switch-label {
      position: absolute;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.66rem;
      font-weight: 800;
      pointer-events: none;
    }

    .label-dark { right: 9px; opacity: 1; color: var(--accent-primary); }
    .label-light { left: 9px; opacity: 0; color: #b45309; }
    [data-theme="light"] .label-dark { opacity: 0; }
    [data-theme="light"] .label-light { opacity: 1; }

    h1, h2 {
      margin: 0 0 0.45rem 0;
      font-size: 1.48rem;
      background: var(--title-grad);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 1.35rem;
      line-height: 1.5;
    }

    .ann-list {
      display: flex;
      flex-direction: column;
      gap: 0.85rem;
      max-height: 410px;
      overflow-y: auto;
      padding-right: 0.25rem;
    }

    .ann-item {
      background: var(--ann-item-bg);
      border: 1px solid var(--ann-item-border);
      border-radius: 12px;
      padding: 1rem 1.1rem;
    }

    .ann-item.pinned {
      border-color: rgba(251, 191, 36, 0.55);
    }

    .ann-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.45rem;
      gap: 0.5rem;
    }

    .ann-badge {
      display: inline-block;
      padding: 0.16rem 0.5rem;
      border-radius: 5px;
      font-size: 0.74rem;
      font-weight: 700;
      background: rgba(0, 240, 255, 0.12);
      color: var(--accent-primary);
      border: 1px solid rgba(0, 240, 255, 0.3);
    }

    .ann-item.pinned .ann-badge {
      background: rgba(245, 158, 11, 0.18);
      color: var(--accent-gold);
      border-color: rgba(245, 158, 11, 0.45);
    }

    .ann-date {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.76rem;
      color: var(--text-muted);
    }

    .ann-title {
      font-size: 0.98rem;
      font-weight: 700;
      color: var(--text-main);
      margin-bottom: 0.35rem;
    }

    .ann-body {
      font-size: 0.85rem;
      color: var(--text-label);
      line-height: 1.55;
      white-space: pre-line;
    }

    .form-group { margin-bottom: 1.15rem; }
    label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-label);
      margin-bottom: 0.45rem;
    }

    input {
      width: 100%;
      padding: 0.78rem 0.95rem;
      background: var(--input-bg);
      border: 1px solid var(--input-border);
      border-radius: 10px;
      color: var(--input-text);
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: var(--accent-primary);
      box-shadow: 0 0 12px var(--bg-glow-1);
    }

    .hint-box {
      background: rgba(2, 132, 199, 0.08);
      border: 1px solid rgba(2, 132, 199, 0.25);
      border-radius: 10px;
      padding: 0.75rem 0.95rem;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 1.35rem;
      line-height: 1.55;
    }
    .hint-box strong { color: var(--accent-primary); }

    .login-btn {
      width: 100%;
      padding: 0.92rem;
      background: var(--btn-grad);
      color: var(--btn-text);
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
    }

    #msg {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.88rem;
      font-weight: 600;
      min-height: 1.25rem;
    }
  </style>
</head>
<body>
  <div id="bootSplash">
    <div class="splash-core">
      <div class="splash-ring"></div>
      <div class="splash-tag">NEXUS GRADE SYSTEM</div>
      <div class="splash-title">國二-2 智慧成績系統</div>
      <div class="splash-bar-track">
        <div class="splash-bar-fill"></div>
      </div>
    </div>
  </div>

  <div class="portal-wrapper" id="portalWrapper">
    <div class="panel-card">
      <div class="top-bar">
        <span class="sys-tag">BULLETIN BOARD // 班級與系統公告欄</span>
      </div>
      <h2>📢 最新公告事項</h2>
      <p class="subtitle">重要考程通知、成績發布動態與系統更新公告</p>
      <div class="ann-list" id="announcementList">
        <div style="color: var(--text-muted); font-size: 0.88rem;">正在載入最新公告...</div>
      </div>
    </div>

    <div class="panel-card">
      <div class="top-bar">
        <span class="sys-tag">NEXUS GRADE // ACCESS PORTAL</span>
        <div class="theme-switch" role="button" tabindex="0" aria-label="切換明暗主題" onclick="toggleTheme()" onkeydown="if(event.key==='Enter'||event.key===' ')toggleTheme()">
          <span class="theme-switch-label label-light">LIGHT</span>
          <div class="theme-switch-knob"></div>
          <span class="theme-switch-label label-dark">DARK</span>
        </div>
      </div>

      <h1>國二-2 智慧成績系統</h1>
      <p class="subtitle">請輸入專屬帳號與密碼登入查看學習數據與全班組距分布</p>

      <div class="form-group">
        <label for="accountInput">登入帳號（學號 / 家長帳號 / 老師帳號）</label>
        <input type="text" id="accountInput" placeholder="學生填學號；家長填 F＋學號" autocomplete="username">
      </div>

      <div class="form-group">
        <label for="passwordInput">登入密碼</label>
        <input type="password" id="passwordInput" placeholder="預設密碼為 123456" autocomplete="current-password" onkeydown="if(event.key==='Enter') handleLogin()">
      </div>

      <div class="hint-box">
        • <strong>學生登入：</strong>直接輸入學號（例如 <code>1410101</code>）<br>
        • <strong>家長登入：</strong>輸入 <code>F</code> ＋ 孩子學號（例如 <code>F1410101</code>，大小寫皆可）<br>
        • 首次登入預設密碼皆為 <code>123456</code>，登入後可自行修改
      </div>

      <button class="login-btn" id="loginBtn" onclick="handleLogin()">登入系統終端</button>
      <div id="msg"></div>
    </div>
  </div>

  <script>
    function applyTheme(theme) {
      if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
      else document.documentElement.removeAttribute('data-theme');
    }
    function toggleTheme() {
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      localStorage.setItem('nexus-theme', next);
      applyTheme(next);
    }
    applyTheme(localStorage.getItem('nexus-theme') || 'dark');

    window.addEventListener('DOMContentLoaded', () => {
      const splash = document.getElementById('bootSplash');
      const wrapper = document.getElementById('portalWrapper');
      setTimeout(() => {
        if (splash) splash.classList.add('fade-out');
        if (wrapper) wrapper.classList.add('card-ready');
      }, 650);
    });

    const SUPABASE_URL = 'https://udtaqnkdohkfzkyzkmwd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Y_GZnXSJAUmTEPvTR-jX0Q_og4LybPV';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    const SCHOOL_DOMAIN = 'cysh.khc.edu.tw';

    async function loadAnnouncements() {
      const listEl = document.getElementById('announcementList');
      try {
        const { data, error } = await supabaseClient
          .from('announcements')
          .select('id, title, content, tag, is_pinned, created_at')
          .order('is_pinned', { ascending: false })
          .order('created_at', { ascending: false });

        if (error || !data || data.length === 0) {
          listEl.innerHTML = '<div style="color: var(--text-muted); font-size: 0.88rem; padding: 1rem 0;">目前尚無公告事項</div>';
          return;
        }

        listEl.innerHTML = data.map(item => {
          const dt = new Date(item.created_at);
          const dateStr = `${dt.getFullYear()}/${String(dt.getMonth() + 1).padStart(2, '0')}/${String(dt.getDate()).padStart(2, '0')}`;
          return `
            <div class="ann-item ${item.is_pinned ? 'pinned' : ''}">
              <div class="ann-meta">
                <span class="ann-badge">${item.is_pinned ? '📌 ' : ''}${item.tag || '一般通知'}</span>
                <span class="ann-date">${dateStr}</span>
              </div>
              <div class="ann-title">${item.title}</div>
              <div class="ann-body">${item.content}</div>
            </div>
          `;
        }).join('');
      } catch (e) {
        listEl.innerHTML = '<div style="color: var(--text-muted); font-size: 0.88rem; padding: 1rem 0;">目前尚無公告事項</div>';
      }
    }

    async function redirectByRole(user) {
      const userEmail = (user.email || '').toLowerCase();
      const accountPrefix = userEmail.split('@')[0];

      // 1. 開發者帳號直接秒進 admin.html
      if (userEmail === '202020@cysh.khc.edu.tw') {
        window.location.replace('admin.html');
        return;
      }

      // 2. 優先查詢 profiles 角色設定
      const { data: profile } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', user.id)
        .maybeSingle();

      if (profile && (profile.role === 'admin' || profile.role === 'developer')) {
        window.location.replace('admin.html');
        return;
      }
      if (profile && profile.role === 'parent') {
        window.location.replace('parent.html');
        return;
      }
      if (profile && profile.role === 'student') {
        window.location.replace('student.html');
        return;
      }

      // 3. 資料庫查詢受阻或尚未建立時，自動依帳號前綴分流（F 開頭為家長，其餘學號為學生）
      if (/^f\d+$/i.test(accountPrefix)) {
        window.location.replace('parent.html');
      } else {
        window.location.replace('student.html');
      }
    }

    (async () => {
      loadAnnouncements();
      // 若是被內頁踢回來的（帶有 ?error=1），暫停自動跳轉，避免無限迴圈
      if (window.location.search.includes('error=1')) return;
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session && session.user) await redirectByRole(session.user);
    })();

    async function handleLogin() {
      const rawAccount = document.getElementById('accountInput').value.trim();
      const password = document.getElementById('passwordInput').value.trim();
      const msgEl = document.getElementById('msg');
      const btn = document.getElementById('loginBtn');

      if (!rawAccount || !password) {
        msgEl.style.color = '#f43f5e';
        msgEl.innerText = '請輸入帳號與密碼！';
        return;
      }

      const email = rawAccount.includes('@')
        ? rawAccount.toLowerCase()
        : `${rawAccount.toLowerCase()}@${SCHOOL_DOMAIN}`;

      btn.disabled = true;
      msgEl.style.color = 'var(--accent-blue)';
      msgEl.innerText = '正在驗證身分權限...';

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      btn.disabled = false;

      if (error) {
        msgEl.style.color = '#f43f5e';
        msgEl.innerText = '帳號或密碼錯誤，請重新確認！';
        return;
      }

      msgEl.style.color = '#10b981';
      msgEl.innerText = '✓ 驗證成功，正在進入專屬終端...';
      await redirectByRole(data.user);
    }
  </script>
</body>
</html>
