<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NEXUS GRADE // 國二-2小考成績系統</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #060913;
      --card-bg: rgba(15, 23, 42, 0.82);
      --neon-cyan: #00f0ff;
      --neon-emerald: #10b981;
      --neon-amber: #f59e0b;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-dark);
      background-image: 
        radial-gradient(circle at 12% 20%, rgba(0, 240, 255, 0.1) 0%, transparent 40%),
        radial-gradient(circle at 88% 80%, rgba(16, 185, 129, 0.1) 0%, transparent 45%),
        linear-gradient(rgba(0, 240, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 240, 255, 0.03) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      color: var(--text-main);
      padding: 1.5rem;
    }
    .login-card {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 240, 255, 0.25);
      border-radius: 16px;
      padding: 2.5rem;
      box-shadow: 0 0 40px rgba(0, 0, 0, 0.7);
      text-align: center;
    }
    .portal-tag {
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.75rem;
      color: var(--neon-cyan);
      letter-spacing: 0.15em;
      margin-bottom: 0.75rem;
      display: inline-block;
      background: rgba(0, 240, 255, 0.1);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      border: 1px solid rgba(0, 240, 255, 0.25);
    }
    h2 {
      margin: 0 0 0.5rem 0;
      font-size: 1.5rem;
      background: linear-gradient(90deg, #ffffff, #38bdf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 0.85rem;
      color: var(--text-muted);
      margin-bottom: 2rem;
    }
    .form-group {
      text-align: left;
      margin-bottom: 1.25rem;
    }
    label {
      display: block;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      margin-bottom: 0.5rem;
      color: #cbd5e1;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
    }
    input {
      width: 100%;
      padding: 0.75rem 1rem;
      background: rgba(2, 6, 23, 0.8);
      border: 1px solid rgba(148, 163, 184, 0.3);
      border-radius: 10px;
      color: #fff;
      font-size: 0.95rem;
      transition: all 0.2s;
    }
    input:focus {
      outline: none;
      border-color: var(--neon-cyan);
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.3);
    }
    .login-btn {
      width: 100%;
      padding: 0.85rem;
      margin-top: 1rem;
      background: linear-gradient(135deg, #00f0ff 0%, #10b981 100%);
      color: #020617;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.05em;
      cursor: pointer;
      box-shadow: 0 0 20px rgba(16, 185, 129, 0.35);
      transition: transform 0.15s, box-shadow 0.2s, opacity 0.2s;
    }
    .login-btn:hover:not(:disabled) {
      transform: translateY(-1px);
      box-shadow: 0 0 28px rgba(0, 240, 255, 0.5);
    }
    .login-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }
    .links {
      margin-top: 1.5rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
      font-size: 0.85rem;
    }
    .links a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s;
    }
    .links a:hover {
      color: var(--neon-cyan);
    }
    .role-note {
      color: #64748b;
      font-size: 0.8rem;
    }
    #errorMsg {
      margin-top: 1rem;
      font-size: 0.85rem;
      color: #fb7185;
      font-weight: 600;
      min-height: 1.2rem;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="portal-tag">NEXUS ACCESS PORTAL // V2.6</div>
    <h2>國二-2小考成績系統</h2>
    <div class="subtitle">請輸入學號（或教師帳號）與密碼登入</div>

    <div class="form-group">
      <label for="studentId">ACCOUNT ID // 學號或帳號</label>
      <input type="text" id="studentId" placeholder="請輸入學號 (例如：1410101)" autocomplete="username">
    </div>

    <div class="form-group">
      <label for="password">ACCESS KEY // 密碼</label>
      <input type="password" id="password" placeholder="預設密碼：123456" autocomplete="current-password">
    </div>

    <button class="login-btn" id="loginBtn" onclick="login()">啟動連線 // LOGIN</button>
    <div id="errorMsg"></div>

    <div class="links">
      <a href="#" onclick="event.preventDefault(); alert('若忘記密碼，請直接聯繫老師協助重設為預設密碼！')">忘記密碼？</a>
      <span class="role-note">🔒 老師 / 小老師請直接輸入帳號密碼，系統將自動導向管理終端</span>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://udtaqnkdohkfzkyzkmwd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Y_GZnXSJAUmTEPvTR-jX0Q_og4LybPV';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 支援按 Enter 鍵直接登入
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') login();
    });

    async function login() {
      const idInput = document.getElementById('studentId').value.trim();
      const password = document.getElementById('password').value.trim();
      const errorMsg = document.getElementById('errorMsg');
      const loginBtn = document.getElementById('loginBtn');
      errorMsg.innerText = '';

      if (!idInput || !password) {
        errorMsg.innerText = '請完整輸入帳號與密碼！';
        return;
      }

      loginBtn.disabled = true;
      loginBtn.innerText = '身份驗證中...';

      // 若未包含 @ 則自動補上學校網域，若有包含 @ 則直接使用完整信箱
      const email = idInput.includes('@') ? idInput : `${idInput}@cysh.khc.edu.tw`;

      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

      if (error) {
        errorMsg.innerText = '登入失敗：帳號或密碼錯誤';
        loginBtn.disabled = false;
        loginBtn.innerText = '啟動連線 // LOGIN';
        return;
      }

      const { data: profile, error: profileError } = await supabaseClient
        .from('profiles')
        .select('role')
        .eq('id', data.user.id)
        .single();

      if (profileError || !profile) {
        errorMsg.innerText = '無法讀取帳號權限資料，請聯繫管理員！';
        await supabaseClient.auth.signOut();
        loginBtn.disabled = false;
        loginBtn.innerText = '啟動連線 // LOGIN';
        return;
      }

      // 依據資料庫角色自動分流
      if (profile.role === 'student') {
        window.location.href = 'student.html';
      } else if (profile.role === 'admin' || profile.role === 'grader') {
        window.location.href = 'admin.html';
      } else {
        errorMsg.innerText = '此帳號尚未設定有效權限！';
        await supabaseClient.auth.signOut();
        loginBtn.disabled = false;
        loginBtn.innerText = '啟動連線 // LOGIN';
      }
    }
  </script>
</body>
</html>
