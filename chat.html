<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS DIRECT // 國二-2 班級即時訊息</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-base: #060913;
      --bg-glow-1: rgba(0, 240, 255, 0.1);
      --bg-glow-2: rgba(16, 185, 129, 0.1);
      --grid-line: rgba(0, 240, 255, 0.03);
      --panel-bg: rgba(15, 23, 42, 0.88);
      --sidebar-bg: rgba(2, 6, 23, 0.65);
      --border-color: rgba(0, 240, 255, 0.22);
      --accent-primary: #00f0ff;
      --accent-blue: #38bdf8;
      --accent-emerald: #10b981;
      --accent-gold: #fbbf24;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
      --item-hover: rgba(0, 240, 255, 0.07);
      --item-active: rgba(0, 240, 255, 0.15);
      --bubble-me: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);
      --bubble-me-text: #ffffff;
      --bubble-other: rgba(30, 41, 59, 0.92);
      --bubble-other-text: #f1f5f9;
      --input-bg: rgba(2, 6, 23, 0.85);
      --modal-bg: #0f172a;
      --pill-bg: rgba(2, 6, 23, 0.85);
      --pill-border: rgba(0, 240, 255, 0.4);
      --pill-knob: linear-gradient(135deg, #00f0ff, #38bdf8);
    }

    [data-theme="light"] {
      --bg-base: #eef3f9;
      --bg-glow-1: rgba(2, 132, 199, 0.11);
      --bg-glow-2: rgba(16, 185, 129, 0.09);
      --grid-line: rgba(14, 116, 144, 0.065);
      --panel-bg: rgba(255, 255, 255, 0.94);
      --sidebar-bg: rgba(248, 250, 252, 0.95);
      --border-color: rgba(2, 132, 199, 0.22);
      --accent-primary: #0284c7;
      --accent-blue: #0369a1;
      --accent-emerald: #059669;
      --accent-gold: #d97706;
      --accent-purple: #7e22ce;
      --text-main: #0f172a;
      --text-sub: #334155;
      --text-muted: #64748b;
      --item-hover: rgba(2, 132, 199, 0.07);
      --item-active: rgba(2, 132, 199, 0.14);
      --bubble-me: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
      --bubble-me-text: #ffffff;
      --bubble-other: #e2e8f0;
      --bubble-other-text: #0f172a;
      --input-bg: #f1f5f9;
      --modal-bg: #ffffff;
      --pill-bg: #e2e8f0;
      --pill-border: rgba(2, 132, 199, 0.38);
      --pill-knob: linear-gradient(135deg, #f59e0b, #fbbf24);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 12% 20%, var(--bg-glow-1) 0%, transparent 40%),
        radial-gradient(circle at 88% 80%, var(--bg-glow-2) 0%, transparent 45%),
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      overflow: hidden;
    }

    .ig-shell {
      width: 100%;
      max-width: 1080px;
      height: 100%;
      max-height: 820px;
      background: var(--panel-bg);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      display: grid;
      grid-template-columns: 325px 1fr;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
    }

    .ig-sidebar {
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .sidebar-top {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.45rem;
    }

    .back-btn {
      background: rgba(2, 132, 199, 0.14);
      color: var(--accent-primary);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.7rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .new-group-btn {
      background: linear-gradient(135deg, #00f0ff 0%, #10b981 100%);
      color: #020617;
      border: none;
      padding: 0.42rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
    }

    .theme-switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 68px;
      height: 26px;
      padding: 3px;
      border-radius: 999px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }

    .theme-switch-knob {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--pill-knob);
      transition: transform 0.3s ease;
    }

    [data-theme="light"] .theme-switch-knob { transform: translateX(42px); }

    .theme-switch-label {
      position: absolute;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.6rem;
      font-weight: 800;
      pointer-events: none;
    }
    .label-dark { right: 7px; color: var(--accent-primary); }
    .label-light { left: 7px; opacity: 0; color: #b45309; }
    [data-theme="light"] .label-dark { opacity: 0; }
    [data-theme="light"] .label-light { opacity: 1; }

    .search-box {
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .search-box input {
      width: 100%;
      padding: 0.52rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 0.86rem;
      outline: none;
    }

    .thread-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.45rem;
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0.55rem 0.75rem 0.35rem;
      letter-spacing: 0.08em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .thread-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.68rem 0.8rem;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s ease;
      position: relative;
    }

    .thread-item:hover { background: var(--item-hover); }
    .thread-item.active { background: var(--item-active); }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 800;
      font-size: 0.9rem;
      flex-shrink: 0;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.22), rgba(16, 185, 129, 0.22));
      border: 1.5px solid var(--accent-primary);
      color: var(--accent-primary);
    }

    .avatar.group-av {
      background: linear-gradient(135deg, #f59e0b, #ec4899);
      border: none;
      color: #ffffff;
      font-size: 1.1rem;
    }

    .avatar.custom-room-av {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border: none;
      color: #ffffff;
      font-size: 1rem;
    }

    .avatar.teacher-av {
      border-color: var(--accent-emerald);
      color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.18);
    }

    .avatar.audit-av {
      border-color: var(--accent-purple);
      color: var(--accent-purple);
      background: rgba(168, 85, 247, 0.18);
      font-size: 0.8rem;
    }

    .thread-info {
      flex: 1;
      min-width: 0;
    }

    .thread-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .role-pill {
      font-size: 0.68rem;
      padding: 1px 6px;
      border-radius: 5px;
      background: rgba(16, 185, 129, 0.18);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .thread-preview {
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .unread-badge {
      background: #f43f5e;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 6px;
    }

    .ig-main {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .chat-header {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .mobile-back-btn {
      display: none;
      background: transparent;
      border: none;
      color: var(--accent-primary);
      font-size: 1.3rem;
      font-weight: 800;
      cursor: pointer;
      padding: 0 0.3rem;
    }

    .chat-title-wrap { flex: 1; min-width: 0; }
    .chat-title { font-size: 1rem; font-weight: 800; color: var(--text-main); }
    .chat-subtitle {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 74%;
    }

    .msg-row.mine {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-row.others {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-sender {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-bottom: 3px;
      padding: 0 4px;
    }

    .msg-bubble-wrap {
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .msg-row.mine .msg-bubble-wrap {
      flex-direction: row-reverse;
    }

    .msg-bubble {
      padding: 0.65rem 0.95rem;
      border-radius: 18px;
      font-size: 0.92rem;
      line-height: 1.45;
      word-break: break-word;
      white-space: pre-wrap;
    }

    .msg-row.mine .msg-bubble {
      background: var(--bubble-me);
      color: var(--bubble-me-text);
      border-bottom-right-radius: 4px;
    }

    .msg-row.others .msg-bubble {
      background: var(--bubble-other);
      color: var(--bubble-other-text);
      border-bottom-left-radius: 4px;
    }

    .msg-time {
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 3px;
      padding: 0 4px;
    }

    .del-msg-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      opacity: 0.55;
      padding: 2px 4px;
    }
    .del-msg-btn:hover { opacity: 1; color: #f43f5e; }

    .chat-input-bar {
      padding: 0.85rem 1.1rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 0.65rem;
    }

    .chat-input-bar input {
      flex: 1;
      padding: 0.72rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 16px;
      outline: none;
    }

    .send-btn {
      background: linear-gradient(135deg, #00f0ff 0%, #10b981 100%);
      color: #020617;
      border: none;
      padding: 0.7rem 1.25rem;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .readonly-banner {
      width: 100%;
      text-align: center;
      padding: 0.72rem 1rem;
      border-radius: 999px;
      background: rgba(168, 85, 247, 0.14);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: var(--accent-purple);
      font-size: 0.84rem;
      font-weight: 700;
    }

    /* 建立群組彈窗 */
    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(2, 6, 23, 0.78);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-card {
      width: 100%;
      max-width: 440px;
      background: var(--modal-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.4rem;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.55);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1.05rem;
      color: var(--accent-primary);
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.35rem;
      cursor: pointer;
    }

    .modal-input {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 0.95rem;
      margin-bottom: 0.85rem;
      outline: none;
    }

    .member-checklist {
      max-height: 240px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.45rem;
      margin-bottom: 1rem;
      background: var(--input-bg);
    }

    .member-check-item {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .member-check-item:hover { background: var(--item-hover); }
    .member-check-item input[type="checkbox"] { width: 17px; height: 17px; accent-color: #00f0ff; }

    @media (max-width: 768px) {
      body { padding: 0; }
      .ig-shell {
        max-height: none;
        border-radius: 0;
        border: none;
        grid-template-columns: 1fr;
      }
      .ig-shell.mobile-chat-open .ig-sidebar { display: none; }
      .ig-shell:not(.mobile-chat-open) .ig-main { display: none; }
      .mobile-back-btn { display: inline-block; }
      .msg-row { max-width: 84%; }
    }
  </style>
</head>
<body>
  <!-- 建立自訂群組彈窗 -->
  <div class="modal-backdrop" id="createRoomModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>👥 建立新群組</h3>
        <button class="modal-close" onclick="closeCreateRoomModal()">✕</button>
      </div>
      <input type="text" id="newRoomNameInput" class="modal-input" maxlength="30" placeholder="輸入群組名稱（例如：數學讀書會、園遊會小組）">
      <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:0.45rem;">勾選要邀請加入的同學或導師（系統會自動包含您自己）：</div>
      <div class="member-checklist" id="memberChecklist"></div>
      <button class="send-btn" style="width:100%; border-radius:10px;" onclick="createCustomRoom()">確認建立群組</button>
    </div>
  </div>

  <div class="ig-shell" id="igShell">
    <div class="ig-sidebar">
      <div class="sidebar-top">
        <button class="back-btn" id="backPortalBtn" onclick="goBackPortal()">← 返回</button>
        <button class="new-group-btn" id="openCreateRoomBtn" onclick="openCreateRoomModal()">＋ 建立群組</button>
        <div class="theme-switch" role="button" tabindex="0" aria-label="切換明暗主題" onclick="toggleTheme()" onkeydown="if(event.key==='Enter'||event.key===' ')toggleTheme()">
          <span class="theme-switch-label label-light">LIGHT</span>
          <div class="theme-switch-knob"></div>
          <span class="theme-switch-label label-dark">DARK</span>
        </div>
      </div>

      <div class="search-box">
        <input type="text" id="contactSearchInput" placeholder="🔍 搜尋群組、座號或姓名..." oninput="renderThreadList()">
      </div>

      <div class="thread-list" id="threadList">
        <div style="padding:1rem; color:var(--text-muted); font-size:0.86rem;">正在載入訊息列表...</div>
      </div>
    </div>

    <div class="ig-main">
      <div class="chat-header">
        <button class="mobile-back-btn" onclick="closeMobileChat()">‹</button>
        <div class="avatar group-av" id="activeAvatar">📢</div>
        <div class="chat-title-wrap">
          <div class="chat-title" id="activeChatTitle">國二-2 班級大群</div>
          <div class="chat-subtitle" id="activeChatSubtitle">全班同學與導師共同討論區</div>
        </div>
      </div>

      <div class="messages-area" id="messagesArea">
        <div style="text-align:center; color:var(--text-muted); margin-top:2rem;">載入訊息中...</div>
      </div>

      <div class="chat-input-bar" id="chatInputBar">
        <input type="text" id="messageInput" maxlength="500" placeholder="輸入訊息..." autocomplete="off" onkeydown="handleInputKeydown(event)">
        <button type="button" class="send-btn" id="sendBtn" onclick="sendMessage()">傳送</button>
      </div>
    </div>
  </div>

  <script>
    function applyTheme(theme) {
      if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
      else document.documentElement.removeAttribute('data-theme');
    }
    function toggleTheme() {
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      localStorage.setItem('nexus-theme', next);
      applyTheme(next);
    }
    applyTheme(localStorage.getItem('nexus-theme') || 'dark');

    const SUPABASE_URL = 'https://udtaqnkdohkfzkyzkmwd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Y_GZnXSJAUmTEPvTR-jX0Q_og4LybPV';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let me = null;
    let isDevAuditor = false;
    let contacts = [];
    let userMap = {};
    let customRooms = [];
    let roomMembersMap = {};
    let allMessages = [];
    let activeChannel = { type: 'group', targetUser: null, pairUsers: null, roomId: null };
    let isSending = false;

    function goBackPortal() {
      if (me && (me.role === 'admin' || isDevAuditor)) {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'student.html';
      }
    }

    function closeMobileChat() {
      document.getElementById('igShell').classList.remove('mobile-chat-open');
    }

    function handleInputKeydown(e) {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      }
    }

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      const { data: myProfile } = await supabaseClient
        .from('profiles')
        .select('id, seat_number, name, role, email')
        .eq('id', session.user.id)
        .single();

      if (!myProfile || myProfile.role === 'parent') {
        alert('此功能僅限班級成員使用！');
        window.location.href = 'index.html';
        return;
      }

      me = myProfile;
      isDevAuditor = me.role === 'developer' || (me.email || '').toLowerCase() === '202020@cysh.khc.edu.tw';

      if (isDevAuditor) {
        document.getElementById('openCreateRoomBtn').style.display = 'none';
        document.getElementById('chatInputBar').innerHTML =
          '<div class="readonly-banner">👁️ 系統管理員隱形唯讀模式（可檢視大群、所有自建小群與私聊紀錄，無法發言或創群）</div>';
      }

      const { data: users } = await supabaseClient
        .from('profiles')
        .select('id, seat_number, name, role, email')
        .in('role', ['student', 'admin'])
        .order('seat_number', { ascending: true });

      const visibleMembers = (users || []).filter(u => (u.email || '').toLowerCase() !== '202020@cysh.khc.edu.tw');
      visibleMembers.forEach(u => { userMap[u.id] = u; });

      contacts = visibleMembers.filter(u => u.id !== me.id);

      await Promise.all([loadRoomsAndMembers(), loadAllMessages()]);
      selectGroupChannel(false);
      subscribeRealtime();
    }

    async function loadRoomsAndMembers() {
      const { data: rooms } = await supabaseClient
        .from('chat_rooms')
        .select('*')
        .order('created_at', { ascending: false });

      customRooms = rooms || [];

      const { data: members } = await supabaseClient
        .from('chat_room_members')
        .select('room_id, user_id');

      roomMembersMap = {};
      (members || []).forEach(m => {
        if (!roomMembersMap[m.room_id]) roomMembersMap[m.room_id] = [];
        roomMembersMap[m.room_id].push(m.user_id);
      });
    }

    async function loadAllMessages() {
      const { data, error } = await supabaseClient
        .from('chat_messages')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(1000);

      if (!error && data) {
        allMessages = data;
        renderThreadList();
        renderActiveMessages();
      }
    }

    function subscribeRealtime() {
      supabaseClient
        .channel('nexus-direct-realtime')
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => {
          const newMsg = payload.new;
          if (!allMessages.some(m => m.id === newMsg.id)) {
            allMessages.push(newMsg);
          }

          if (
            !isDevAuditor &&
            activeChannel.type === 'dm' &&
            activeChannel.targetUser &&
            newMsg.channel_type === 'dm' &&
            newMsg.sender_id === activeChannel.targetUser.id &&
            newMsg.receiver_id === me.id
          ) {
            markDmAsRead(activeChannel.targetUser.id);
          }

          renderThreadList();
          renderActiveMessages();
        })
        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'chat_messages' }, payload => {
          allMessages = allMessages.filter(m => m.id !== payload.old.id);
          renderThreadList();
          renderActiveMessages();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_rooms' }, async () => {
          await loadRoomsAndMembers();
          renderThreadList();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_room_members' }, async () => {
          await loadRoomsAndMembers();
          renderThreadList();
        })
        .subscribe();
    }

    function openCreateRoomModal() {
      if (isDevAuditor) return;
      document.getElementById('newRoomNameInput').value = '';
      const listEl = document.getElementById('memberChecklist');
      listEl.innerHTML = contacts.map(c => {
        const isTeacher = c.role === 'admin';
        const label = isTeacher ? `👑 ${c.name}（導師）` : `${c.seat_number ?? '-'}號 ${c.name}`;
        return `
          <label class="member-check-item">
            <input type="checkbox" value="${c.id}">
            <span>${escapeHtml(label)}</span>
          </label>
        `;
      }).join('');
      document.getElementById('createRoomModal').style.display = 'flex';
    }

    function closeCreateRoomModal() {
      document.getElementById('createRoomModal').style.display = 'none';
    }

    async function createCustomRoom() {
      if (isDevAuditor) return;
      const roomName = document.getElementById('newRoomNameInput').value.trim();
      if (!roomName) {
        alert('請輸入群組名稱！');
        return;
      }

      const checkedBoxes = Array.from(document.querySelectorAll('#memberChecklist input[type="checkbox"]:checked'));
      const selectedIds = checkedBoxes.map(cb => cb.value);

      if (selectedIds.length === 0) {
        alert('請至少勾選 1 位同學或導師加入群組！');
        return;
      }

      const { data: roomData, error: roomErr } = await supabaseClient
        .from('chat_rooms')
        .insert([{ name: roomName, created_by: me.id }])
        .select()
        .single();

      if (roomErr || !roomData) {
        alert('建立群組失敗：' + (roomErr ? roomErr.message : '未知錯誤'));
        return;
      }

      const memberIds = Array.from(new Set([me.id, ...selectedIds]));
      const memberRows = memberIds.map(uid => ({ room_id: roomData.id, user_id: uid }));

      const { error: memErr } = await supabaseClient
        .from('chat_room_members')
        .insert(memberRows);

      if (memErr) {
        alert('加入群組成員失敗：' + memErr.message);
        return;
      }

      closeCreateRoomModal();
      await loadRoomsAndMembers();
      selectCustomRoom(roomData.id, true);
    }

    async function markDmAsRead(senderId) {
      if (isDevAuditor) return;
      const unreadIds = allMessages
        .filter(m => m.channel_type === 'dm' && m.sender_id === senderId && m.receiver_id === me.id && !m.is_read)
        .map(m => m.id);

      if (unreadIds.length === 0) return;

      allMessages.forEach(m => {
        if (unreadIds.includes(m.id)) m.is_read = true;
      });
      renderThreadList();

      await supabaseClient
        .from('chat_messages')
        .update({ is_read: true })
        .in('id', unreadIds);
    }

    function selectGroupChannel(openMobile = true) {
      activeChannel = { type: 'group', targetUser: null, pairUsers: null, roomId: null };
      const memberTotal = isDevAuditor ? contacts.length : contacts.length + 1;
      document.getElementById('activeAvatar').className = 'avatar group-av';
      document.getElementById('activeAvatar').innerText = '📢';
      document.getElementById('activeChatTitle').innerText = '國二-2 班級大群';
      document.getElementById('activeChatSubtitle').innerText = isDevAuditor
        ? `共 ${memberTotal} 位成員（隱形稽核檢視中）`
        : `共 ${memberTotal} 位成員（全班同學與導師）`;
      if (openMobile) document.getElementById('igShell').classList.add('mobile-chat-open');
      renderThreadList();
      renderActiveMessages();
    }

    function selectCustomRoom(roomId, openMobile = true) {
      const room = customRooms.find(r => r.id === roomId);
      if (!room) return;

      activeChannel = { type: 'room', targetUser: null, pairUsers: null, roomId: room.id };
      const memberIds = roomMembersMap[room.id] || [];
      const memberNames = memberIds.map(uid => formatUserShort(userMap[uid])).join('、');

      document.getElementById('activeAvatar').className = 'avatar custom-room-av';
      document.getElementById('activeAvatar').innerText = '👥';
      document.getElementById('activeChatTitle').innerText = room.name;
      document.getElementById('activeChatSubtitle').innerText = `成員 (${memberIds.length}人)：${memberNames || '載入中'}`;

      if (openMobile) document.getElementById('igShell').classList.add('mobile-chat-open');
      renderThreadList();
      renderActiveMessages();
    }

    async function selectDmChannel(userId) {
      if (isDevAuditor) return;
      const target = contacts.find(c => c.id === userId);
      if (!target) return;

      activeChannel = { type: 'dm', targetUser: target, pairUsers: null, roomId: null };
      const isTeacher = target.role === 'admin';

      document.getElementById('activeAvatar').className = `avatar ${isTeacher ? 'teacher-av' : ''}`;
      document.getElementById('activeAvatar').innerText = isTeacher ? '師' : `${target.seat_number ?? '#'}`;
      document.getElementById('activeChatTitle').innerText = isTeacher
        ? `${target.name}（導師）`
        : `${target.seat_number ?? '-'}號 ${target.name}`;
      document.getElementById('activeChatSubtitle').innerText = '1 對 1 私人訊息（僅雙方可見）';

      document.getElementById('igShell').classList.add('mobile-chat-open');
      await markDmAsRead(target.id);
      renderThreadList();
      renderActiveMessages();
    }

    function selectAuditPair(uid1, uid2) {
      if (!isDevAuditor) return;
      const u1 = userMap[uid1] || { id: uid1, name: '成員A', seat_number: '-' };
      const u2 = userMap[uid2] || { id: uid2, name: '成員B', seat_number: '-' };
      const label1 = formatUserShort(u1);
      const label2 = formatUserShort(u2);

      activeChannel = { type: 'audit_dm', targetUser: null, pairUsers: [u1, u2], roomId: null };
      document.getElementById('activeAvatar').className = 'avatar audit-av';
      document.getElementById('activeAvatar').innerText = '私聊';
      document.getElementById('activeChatTitle').innerText = `${label1} ⇄ ${label2}`;
      document.getElementById('activeChatSubtitle').innerText = '系統管理員隱形唯讀稽核（無法發送訊息）';

      document.getElementById('igShell').classList.add('mobile-chat-open');
      renderThreadList();
      renderActiveMessages();
    }

    function formatUserShort(u) {
      if (!u) return '未知成員';
      return u.role === 'admin' ? `${u.name}(導師)` : `${u.seat_number ?? '-'}號${u.name}`;
    }

    function renderThreadList() {
      const keyword = document.getElementById('contactSearchInput').value.trim().toLowerCase();
      const listEl = document.getElementById('threadList');

      const groupMsgs = allMessages.filter(m => m.channel_type === 'group');
      const lastGroup = groupMsgs[groupMsgs.length - 1];
      const groupPreview = lastGroup ? `${lastGroup.sender_name}：${lastGroup.content}` : '點擊進入班級大群...';

      let html = `
        <div class="section-label">班級官方大群</div>
        <div class="thread-item ${activeChannel.type === 'group' ? 'active' : ''}" onclick="selectGroupChannel(true)">
          <div class="avatar group-av">📢</div>
          <div class="thread-info">
            <div class="thread-name">國二-2 班級大群</div>
            <div class="thread-preview">${escapeHtml(groupPreview)}</div>
          </div>
        </div>
      `;

      const filteredRooms = customRooms.filter(r => {
        if (!keyword) return true;
        return r.name.toLowerCase().includes(keyword);
      });

      html += `<div class="section-label">${isDevAuditor ? '全班自建小群監看（唯讀）' : '我的自建群組'}</div>`;
      if (filteredRooms.length === 0) {
        html += `<div style="padding:0.55rem 0.85rem; color:var(--text-muted); font-size:0.8rem;">${isDevAuditor ? '目前尚無學生自建群組' : '尚未加入自建群組，可按上方「＋ 建立群組」'}</div>`;
      } else {
        html += filteredRooms.map(r => {
          const rMsgs = allMessages.filter(m => m.channel_type === 'room' && m.room_id === r.id);
          const lastR = rMsgs[rMsgs.length - 1];
          const mCount = (roomMembersMap[r.id] || []).length;
          const preview = lastR ? `${lastR.sender_name}：${lastR.content}` : `群組成員 ${mCount} 人・點擊開始聊天`;
          const isActive = activeChannel.type === 'room' && activeChannel.roomId === r.id;

          return `
            <div class="thread-item ${isActive ? 'active' : ''}" onclick="selectCustomRoom(${r.id}, true)">
              <div class="avatar custom-room-av">👥</div>
              <div class="thread-info">
                <div class="thread-name">${escapeHtml(r.name)} <span style="font-size:0.72rem; color:var(--text-muted);">(${mCount})</span></div>
                <div class="thread-preview">${escapeHtml(preview)}</div>
              </div>
            </div>
          `;
        }).join('');
      }

      if (isDevAuditor) {
        html += `<div class="section-label">全班私聊紀錄監看（唯讀）</div>`;
        const pairMap = new Map();

        allMessages
          .filter(m => m.channel_type === 'dm' && m.sender_id && m.receiver_id)
          .forEach(m => {
            const sortedIds = [m.sender_id, m.receiver_id].sort();
            const pairKey = `${sortedIds[0]}__${sortedIds[1]}`;
            pairMap.set(pairKey, { uid1: sortedIds[0], uid2: sortedIds[1], lastMsg: m });
          });

        const pairs = Array.from(pairMap.values()).reverse().filter(p => {
          if (!keyword) return true;
          const n1 = formatUserShort(userMap[p.uid1]).toLowerCase();
          const n2 = formatUserShort(userMap[p.uid2]).toLowerCase();
          return n1.includes(keyword) || n2.includes(keyword);
        });

        if (pairs.length === 0) {
          html += `<div style="padding:0.65rem 0.85rem; color:var(--text-muted); font-size:0.8rem;">目前尚無任何私聊對話紀錄</div>`;
        } else {
          html += pairs.map(p => {
            const label1 = formatUserShort(userMap[p.uid1]);
            const label2 = formatUserShort(userMap[p.uid2]);
            const isActive =
              activeChannel.type === 'audit_dm' &&
              activeChannel.pairUsers &&
              [activeChannel.pairUsers[0].id, activeChannel.pairUsers[1].id].sort().join('__') === `${p.uid1}__${p.uid2}`;

            return `
              <div class="thread-item ${isActive ? 'active' : ''}" onclick="selectAuditPair('${p.uid1}', '${p.uid2}')">
                <div class="avatar audit-av">私聊</div>
                <div class="thread-info">
                  <div class="thread-name">${escapeHtml(label1)} ⇄ ${escapeHtml(label2)}</div>
                  <div class="thread-preview">${escapeHtml(p.lastMsg.sender_name)}：${escapeHtml(p.lastMsg.content)}</div>
                </div>
              </div>
            `;
          }).join('');
        }

        listEl.innerHTML = html;
        return;
      }

      html += `<div class="section-label">私聊聯絡人（1 對 1）</div>`;
      const filtered = contacts.filter(c => {
        if (!keyword) return true;
        const seatStr = String(c.seat_number ?? '');
        return seatStr.includes(keyword) || (c.name || '').toLowerCase().includes(keyword);
      });

      html += filtered.map(c => {
        const isTeacher = c.role === 'admin';
        const dmMsgs = allMessages.filter(m =>
          m.channel_type === 'dm' &&
          ((m.sender_id === me.id && m.receiver_id === c.id) || (m.sender_id === c.id && m.receiver_id === me.id))
        );
        const lastDm = dmMsgs[dmMsgs.length - 1];
        const unreadCount = dmMsgs.filter(m => m.sender_id === c.id && m.receiver_id === me.id && !m.is_read).length;
        const preview = lastDm
          ? (lastDm.sender_id === me.id ? `你：${lastDm.content}` : lastDm.content)
          : '點擊開始私聊...';

        const isActive = activeChannel.type === 'dm' && activeChannel.targetUser && activeChannel.targetUser.id === c.id;

        return `
          <div class="thread-item ${isActive ? 'active' : ''}" onclick="selectDmChannel('${c.id}')">
            <div class="avatar ${isTeacher ? 'teacher-av' : ''}">${isTeacher ? '師' : (c.seat_number ?? '#')}</div>
            <div class="thread-info">
              <div class="thread-name">
                ${isTeacher ? c.name : `${c.seat_number ?? '-'}號 ${c.name}`}
                ${isTeacher ? '<span class="role-pill">導師</span>' : ''}
              </div>
              <div class="thread-preview">${escapeHtml(preview)}</div>
            </div>
            ${unreadCount > 0 ? `<span class="unread-badge">${unreadCount}</span>` : ''}
          </div>
        `;
      }).join('');

      listEl.innerHTML = html;
    }

    function renderActiveMessages() {
      const area = document.getElementById('messagesArea');
      let msgs = [];

      if (activeChannel.type === 'group') {
        msgs = allMessages.filter(m => m.channel_type === 'group');
      } else if (activeChannel.type === 'room' && activeChannel.roomId) {
        msgs = allMessages.filter(m => m.channel_type === 'room' && m.room_id === activeChannel.roomId);
      } else if (activeChannel.type === 'dm' && activeChannel.targetUser) {
        const tid = activeChannel.targetUser.id;
        msgs = allMessages.filter(m =>
          m.channel_type === 'dm' &&
          ((m.sender_id === me.id && m.receiver_id === tid) || (m.sender_id === tid && m.receiver_id === me.id))
        );
      } else if (activeChannel.type === 'audit_dm' && activeChannel.pairUsers) {
        const [u1, u2] = activeChannel.pairUsers;
        msgs = allMessages.filter(m =>
          m.channel_type === 'dm' &&
          ((m.sender_id === u1.id && m.receiver_id === u2.id) || (m.sender_id === u2.id && m.receiver_id === u1.id))
        );
      }

      if (msgs.length === 0) {
        area.innerHTML = '<div style="text-align:center; color:var(--text-muted); margin-top:2.5rem; font-size:0.88rem;">目前還沒有訊息紀錄</div>';
        return;
      }

      const canModDelete = me.role === 'admin' || isDevAuditor;

      area.innerHTML = msgs.map(m => {
        const isMine = !isDevAuditor && m.sender_id === me.id;
        const dt = new Date(m.created_at);
        const timeStr = `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;
        const senderLabel = m.sender_role === 'admin'
          ? `👑 ${m.sender_name}（導師）`
          : `${m.sender_seat ?? '-'}號 ${m.sender_name}`;

        const showSenderName = !isMine && (activeChannel.type === 'group' || activeChannel.type === 'room' || activeChannel.type === 'audit_dm');

        return `
          <div class="msg-row ${isMine ? 'mine' : 'others'}">
            ${showSenderName ? `<div class="msg-sender">${escapeHtml(senderLabel)}</div>` : ''}
            <div class="msg-bubble-wrap">
              <div class="msg-bubble">${escapeHtml(m.content)}</div>
              ${(isMine || canModDelete) ? `<button class="del-msg-btn" title="收回/刪除訊息" onclick="deleteMessage(${m.id})">✕</button>` : ''}
            </div>
            <div class="msg-time">${timeStr}</div>
          </div>
        `;
      }).join('');

      area.scrollTop = area.scrollHeight;
    }

    async function sendMessage() {
      if (isDevAuditor || isSending) return;

      const input = document.getElementById('messageInput');
      const content = input.value.trim();
      if (!content) return;

      isSending = true;

      // 強制清除輸入框並結束注音組字殘留
      input.value = '';
      input.blur();
      requestAnimationFrame(() => {
        input.value = '';
        input.focus();
      });

      const payload = {
        channel_type: activeChannel.type,
        sender_id: me.id,
        sender_name: me.name || '成員',
        sender_seat: me.seat_number ?? null,
        sender_role: me.role,
        receiver_id: activeChannel.type === 'dm' ? activeChannel.targetUser.id : null,
        room_id: activeChannel.type === 'room' ? activeChannel.roomId : null,
        content
      };

      try {
        const { data, error } = await supabaseClient
          .from('chat_messages')
          .insert([payload])
          .select()
          .single();

        if (error) {
          alert('傳送失敗：' + error.message);
          input.value = content;
          return;
        }

        if (data && !allMessages.some(m => m.id === data.id)) {
          allMessages.push(data);
          renderThreadList();
          renderActiveMessages();
        }
      } finally {
        isSending = false;
      }
    }

    async function deleteMessage(msgId) {
      if (!confirm('確定要收回 / 刪除此則訊息嗎？')) return;
      const { error } = await supabaseClient
        .from('chat_messages')
        .delete()
        .eq('id', msgId);

      if (error) {
        alert('刪除失敗：' + error.message);
      } else {
        allMessages = allMessages.filter(m => m.id !== msgId);
        renderThreadList();
        renderActiveMessages();
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    init();
  </script>
</body>
</html>
