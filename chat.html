<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>NEXUS DIRECT // 國二-2 班級即時訊息</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-base: #060913;
      --bg-glow-1: rgba(0, 240, 255, 0.1);
      --bg-glow-2: rgba(16, 185, 129, 0.1);
      --grid-line: rgba(0, 240, 255, 0.03);
      --panel-bg: rgba(15, 23, 42, 0.88);
      --sidebar-bg: rgba(2, 6, 23, 0.65);
      --border-color: rgba(0, 240, 255, 0.22);
      --accent-primary: #00f0ff;
      --accent-blue: #38bdf8;
      --accent-emerald: #10b981;
      --accent-gold: #fbbf24;
      --accent-purple: #a855f7;
      --text-main: #f8fafc;
      --text-sub: #cbd5e1;
      --text-muted: #94a3b8;
      --item-hover: rgba(0, 240, 255, 0.07);
      --item-active: rgba(0, 240, 255, 0.15);
      --bubble-me: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);
      --bubble-me-text: #ffffff;
      --bubble-other: rgba(30, 41, 59, 0.92);
      --bubble-other-text: #f1f5f9;
      --input-bg: rgba(2, 6, 23, 0.85);
      --modal-bg: #0f172a;
      --pill-bg: rgba(2, 6, 23, 0.85);
      --pill-border: rgba(0, 240, 255, 0.4);
      --pill-knob: linear-gradient(135deg, #00f0ff, #38bdf8);
    }

    [data-theme="light"] {
      --bg-base: #eef3f9;
      --bg-glow-1: rgba(2, 132, 199, 0.11);
      --bg-glow-2: rgba(16, 185, 129, 0.09);
      --grid-line: rgba(14, 116, 144, 0.065);
      --panel-bg: rgba(255, 255, 255, 0.94);
      --sidebar-bg: rgba(248, 250, 252, 0.95);
      --border-color: rgba(2, 132, 199, 0.22);
      --accent-primary: #0284c7;
      --accent-blue: #0369a1;
      --accent-emerald: #059669;
      --accent-gold: #d97706;
      --accent-purple: #7e22ce;
      --text-main: #0f172a;
      --text-sub: #334155;
      --text-muted: #64748b;
      --item-hover: rgba(2, 132, 199, 0.07);
      --item-active: rgba(2, 132, 199, 0.14);
      --bubble-me: linear-gradient(135deg, #0284c7 0%, #0d9488 100%);
      --bubble-me-text: #ffffff;
      --bubble-other: #e2e8f0;
      --bubble-other-text: #0f172a;
      --input-bg: #f1f5f9;
      --modal-bg: #ffffff;
      --pill-bg: #e2e8f0;
      --pill-border: rgba(2, 132, 199, 0.38);
      --pill-knob: linear-gradient(135deg, #f59e0b, #fbbf24);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      height: 100dvh;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-base);
      background-image:
        radial-gradient(circle at 12% 20%, var(--bg-glow-1) 0%, transparent 40%),
        radial-gradient(circle at 88% 80%, var(--bg-glow-2) 0%, transparent 45%),
        linear-gradient(var(--grid-line) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-line) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 30px 30px, 30px 30px;
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      overflow: hidden;
    }

    .ig-shell {
      width: 100%;
      max-width: 1080px;
      height: 100%;
      max-height: 820px;
      background: var(--panel-bg);
      backdrop-filter: blur(18px);
      border: 1px solid var(--border-color);
      border-radius: 18px;
      display: grid;
      grid-template-columns: 325px 1fr;
      overflow: hidden;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.55);
    }

    .ig-sidebar {
      background: var(--sidebar-bg);
      border-right: 1px solid var(--border-color);
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .sidebar-top {
      padding: 0.9rem 1rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.45rem;
    }

    .back-btn {
      background: rgba(2, 132, 199, 0.14);
      color: var(--accent-primary);
      border: 1px solid var(--border-color);
      padding: 0.4rem 0.7rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
    }

    .new-group-btn {
      background: linear-gradient(135deg, #00f0ff 0%, #10b981 100%);
      color: #020617;
      border: none;
      padding: 0.42rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 800;
      cursor: pointer;
    }

    .theme-switch {
      position: relative;
      display: inline-flex;
      align-items: center;
      width: 68px;
      height: 26px;
      padding: 3px;
      border-radius: 999px;
      background: var(--pill-bg);
      border: 1px solid var(--pill-border);
      cursor: pointer;
      user-select: none;
      flex-shrink: 0;
    }

    .theme-switch-knob {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--pill-knob);
      transition: transform 0.3s ease;
    }

    [data-theme="light"] .theme-switch-knob { transform: translateX(42px); }

    .theme-switch-label {
      position: absolute;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.6rem;
      font-weight: 800;
      pointer-events: none;
    }
    .label-dark { right: 7px; color: var(--accent-primary); }
    .label-light { left: 7px; opacity: 0; color: #b45309; }
    [data-theme="light"] .label-dark { opacity: 0; }
    [data-theme="light"] .label-light { opacity: 1; }

    .search-box {
      padding: 0.7rem 1rem;
      border-bottom: 1px solid var(--border-color);
    }

    .search-box input {
      width: 100%;
      padding: 0.52rem 0.85rem;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 0.86rem;
      outline: none;
    }

    .thread-list {
      flex: 1;
      overflow-y: auto;
      padding: 0.45rem;
    }

    .section-label {
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--text-muted);
      padding: 0.55rem 0.75rem 0.35rem;
      letter-spacing: 0.08em;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .thread-item {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      padding: 0.68rem 0.8rem;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s ease;
      position: relative;
    }

    .thread-item:hover { background: var(--item-hover); }
    .thread-item.active { background: var(--item-active); }

    .avatar-wrap {
      position: relative;
      flex-shrink: 0;
    }

    .avatar {
      width: 42px;
      height: 42px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      font-weight: 800;
      font-size: 0.9rem;
      background: linear-gradient(135deg, rgba(0, 240, 255, 0.22), rgba(16, 185, 129, 0.22));
      border: 1.5px solid var(--accent-primary);
      color: var(--accent-primary);
    }

    .online-dot {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 11px;
      height: 11px;
      border-radius: 50%;
      background: #10b981;
      border: 2px solid var(--panel-bg);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.85);
    }

    .avatar.group-av {
      background: linear-gradient(135deg, #f59e0b, #ec4899);
      border: none;
      color: #ffffff;
      font-size: 1.1rem;
    }

    .avatar.student-group-av {
      background: linear-gradient(135deg, #10b981, #0ea5e9);
      border: none;
      color: #ffffff;
      font-size: 1.1rem;
    }

    .avatar.custom-room-av {
      background: linear-gradient(135deg, #3b82f6, #8b5cf6);
      border: none;
      color: #ffffff;
      font-size: 1rem;
    }

    .avatar.teacher-av {
      border-color: var(--accent-emerald);
      color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.18);
    }

    .avatar.audit-av {
      border-color: var(--accent-purple);
      color: var(--accent-purple);
      background: rgba(168, 85, 247, 0.18);
      font-size: 0.8rem;
    }

    .thread-info {
      flex: 1;
      min-width: 0;
    }

    .thread-name {
      font-size: 0.9rem;
      font-weight: 700;
      color: var(--text-main);
      display: flex;
      align-items: center;
      gap: 0.35rem;
      flex-wrap: wrap;
    }

    .role-pill {
      font-size: 0.68rem;
      padding: 1px 6px;
      border-radius: 5px;
      background: rgba(16, 185, 129, 0.18);
      color: var(--accent-emerald);
      border: 1px solid rgba(16, 185, 129, 0.4);
    }

    .thread-preview {
      font-size: 0.78rem;
      color: var(--text-muted);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-top: 2px;
    }

    .unread-badge {
      background: #f43f5e;
      color: #ffffff;
      font-size: 0.72rem;
      font-weight: 800;
      min-width: 20px;
      height: 20px;
      border-radius: 999px;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0 6px;
      flex-shrink: 0;
    }

    .ig-main {
      display: flex;
      flex-direction: column;
      height: 100%;
      overflow: hidden;
    }

    .chat-header {
      padding: 0.9rem 1.25rem;
      border-bottom: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .mobile-back-btn {
      display: none;
      background: transparent;
      border: none;
      color: var(--accent-primary);
      font-size: 1.3rem;
      font-weight: 800;
      cursor: pointer;
      padding: 0 0.3rem;
    }

    .chat-title-wrap { flex: 1; min-width: 0; }
    .chat-title { font-size: 1rem; font-weight: 800; color: var(--text-main); }
    .chat-subtitle {
      font-size: 0.76rem;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .room-settings-btn {
      display: none;
      background: rgba(59, 130, 246, 0.16);
      border: 1px solid rgba(59, 130, 246, 0.45);
      color: var(--accent-blue);
      padding: 0.42rem 0.75rem;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 700;
      cursor: pointer;
      flex-shrink: 0;
    }

    .messages-area {
      flex: 1;
      overflow-y: auto;
      padding: 1.2rem;
      display: flex;
      flex-direction: column;
      gap: 0.65rem;
    }

    .msg-row {
      display: flex;
      flex-direction: column;
      max-width: 74%;
      transition: background 0.35s ease;
      border-radius: 12px;
      padding: 2px;
    }

    .msg-row.highlight-flash {
      background: rgba(0, 240, 255, 0.22);
    }

    .msg-row.mine {
      align-self: flex-end;
      align-items: flex-end;
    }

    .msg-row.others {
      align-self: flex-start;
      align-items: flex-start;
    }

    .msg-sender {
      font-size: 0.74rem;
      color: var(--text-muted);
      margin-bottom: 3px;
      padding: 0 4px;
    }

    .msg-bubble-wrap {
      display: flex;
      align-items: center;
      gap: 0.35rem;
    }

    .msg-row.mine .msg-bubble-wrap {
      flex-direction: row-reverse;
    }

    .msg-bubble {
      padding: 0.55rem 0.9rem;
      border-radius: 18px;
      font-size: 0.92rem;
      line-height: 1.4;
      word-break: break-word;
      width: fit-content;
    }

    .msg-bubble.img-only {
      padding: 0.35rem;
      background: transparent !important;
    }

    .reply-quote-box {
      font-size: 0.76rem;
      padding: 0.38rem 0.6rem;
      margin-bottom: 0.42rem;
      border-radius: 10px;
      border-left: 3px solid #00f0ff;
      background: rgba(0, 0, 0, 0.22);
      cursor: pointer;
      opacity: 0.92;
    }

    [data-theme="light"] .msg-row.others .reply-quote-box {
      background: rgba(15, 23, 42, 0.08);
    }

    .reply-quote-sender {
      font-weight: 800;
      margin-bottom: 1px;
    }

    .reply-quote-text {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 220px;
      opacity: 0.88;
    }

    .chat-img {
      max-width: 240px;
      max-height: 280px;
      border-radius: 14px;
      display: block;
      cursor: zoom-in;
      border: 1px solid var(--border-color);
    }

    .msg-row.mine .msg-bubble {
      background: var(--bubble-me);
      color: var(--bubble-me-text);
      border-bottom-right-radius: 4px;
    }

    .msg-row.others .msg-bubble {
      background: var(--bubble-other);
      color: var(--bubble-other-text);
      border-bottom-left-radius: 4px;
    }

    .msg-meta {
      display: flex;
      align-items: center;
      gap: 0.45rem;
      font-size: 0.68rem;
      color: var(--text-muted);
      margin-top: 3px;
      padding: 0 4px;
    }

    .read-receipt {
      color: var(--accent-emerald);
      font-weight: 700;
    }

    .msg-actions {
      display: flex;
      align-items: center;
      gap: 2px;
      opacity: 0.65;
    }
    .msg-actions:hover { opacity: 1; }

    .action-icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 0.82rem;
      cursor: pointer;
      padding: 2px 4px;
    }
    .action-icon-btn:hover { color: var(--accent-primary); }
    .action-icon-btn.del-btn:hover { color: #f43f5e; }

    .reply-preview-bar {
      display: none;
      padding: 0.55rem 1.1rem;
      border-top: 1px solid var(--border-color);
      background: rgba(0, 240, 255, 0.08);
      justify-content: space-between;
      align-items: center;
      gap: 0.6rem;
      font-size: 0.82rem;
    }

    .reply-preview-info {
      min-width: 0;
      flex: 1;
      border-left: 3px solid var(--accent-primary);
      padding-left: 0.6rem;
    }

    .reply-preview-title {
      font-weight: 800;
      color: var(--accent-primary);
      font-size: 0.78rem;
    }

    .reply-preview-snippet {
      color: var(--text-sub);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .chat-input-bar {
      padding: 0.85rem 1.1rem;
      border-top: 1px solid var(--border-color);
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .media-btns-wrap {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    .camera-only-btn {
      display: none;
    }

    @media (max-width: 768px) and (pointer: coarse) {
      .camera-only-btn { display: flex; }
    }

    .media-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--accent-primary);
      font-size: 1.05rem;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      padding: 0;
    }

    .chat-input-bar input[type="text"] {
      flex: 1;
      min-width: 0;
      padding: 0.72rem 1rem;
      border-radius: 999px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 16px;
      outline: none;
    }

    .send-btn {
      background: linear-gradient(135deg, #00f0ff 0%, #10b981 100%);
      color: #020617;
      border: none;
      padding: 0.7rem 1.15rem;
      border-radius: 999px;
      font-weight: 800;
      font-size: 0.9rem;
      cursor: pointer;
      flex-shrink: 0;
    }

    .danger-btn {
      background: rgba(244, 63, 94, 0.16);
      border: 1px solid rgba(244, 63, 94, 0.45);
      color: #fb7185;
      padding: 0.55rem 0.9rem;
      border-radius: 10px;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
    }

    .readonly-banner {
      width: 100%;
      text-align: center;
      padding: 0.72rem 1rem;
      border-radius: 999px;
      background: rgba(168, 85, 247, 0.14);
      border: 1px solid rgba(168, 85, 247, 0.4);
      color: var(--accent-purple);
      font-size: 0.84rem;
      font-weight: 700;
    }

    .modal-backdrop {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 999;
      background: rgba(2, 6, 23, 0.82);
      backdrop-filter: blur(8px);
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .modal-card {
      width: 100%;
      max-width: 450px;
      max-height: 88dvh;
      overflow-y: auto;
      background: var(--modal-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 1.4rem;
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.55);
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 1rem;
    }

    .modal-header h3 {
      margin: 0;
      font-size: 1.05rem;
      color: var(--accent-primary);
    }

    .modal-close {
      background: transparent;
      border: none;
      color: var(--text-muted);
      font-size: 1.35rem;
      cursor: pointer;
    }

    .modal-input {
      width: 100%;
      padding: 0.65rem 0.9rem;
      border-radius: 10px;
      border: 1px solid var(--border-color);
      background: var(--input-bg);
      color: var(--text-main);
      font-size: 0.95rem;
      margin-bottom: 0.85rem;
      outline: none;
    }

    .member-checklist {
      max-height: 220px;
      overflow-y: auto;
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 0.45rem;
      margin-bottom: 1rem;
      background: var(--input-bg);
    }

    .member-check-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 0.65rem;
      padding: 0.5rem 0.65rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.9rem;
    }

    .member-check-item:hover { background: var(--item-hover); }
    .member-check-item input[type="checkbox"] { width: 17px; height: 17px; accent-color: #00f0ff; }

    #imgLightbox img {
      max-width: 94vw;
      max-height: 88dvh;
      border-radius: 12px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.85);
    }

    @media (max-width: 768px) {
      body { padding: 0; }
      .ig-shell {
        max-height: none;
        border-radius: 0;
        border: none;
        grid-template-columns: 1fr;
      }
      .ig-shell.mobile-chat-open .ig-sidebar { display: none; }
      .ig-shell:not(.mobile-chat-open) .ig-main { display: none; }
      .mobile-back-btn { display: inline-block; }
      .msg-row { max-width: 84%; }
    }
  </style>
</head>
<body>
  <!-- 圖片全螢幕檢視 -->
  <div class="modal-backdrop" id="imgLightbox" onclick="this.style.display='none'">
    <img id="lightboxImg" src="" alt="放大圖片">
  </div>

  <!-- 建立自訂群組彈窗 -->
  <div class="modal-backdrop" id="createRoomModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>👥 建立新群組</h3>
        <button class="modal-close" onclick="closeCreateRoomModal()">✕</button>
      </div>
      <input type="text" id="newRoomNameInput" class="modal-input" maxlength="30" placeholder="輸入群組名稱（例如：數學讀書會、園遊會小組）">
      <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:0.45rem;">勾選要邀請加入的同學或導師（系統會自動包含您自己）：</div>
      <div class="member-checklist" id="memberChecklist"></div>
      <button class="send-btn" style="width:100%; border-radius:10px;" onclick="createCustomRoom()">確認建立群組</button>
    </div>
  </div>

  <!-- 群組資訊與管理彈窗（僅自建小群） -->
  <div class="modal-backdrop" id="roomInfoModal">
    <div class="modal-card">
      <div class="modal-header">
        <h3>⚙️ 小群組資訊與暱稱設定</h3>
        <button class="modal-close" onclick="closeRoomInfoModal()">✕</button>
      </div>
      <div id="roomInfoBody"></div>
    </div>
  </div>

  <div class="ig-shell" id="igShell">
    <div class="ig-sidebar">
      <div class="sidebar-top">
        <button class="back-btn" id="backPortalBtn" onclick="goBackPortal()">← 返回</button>
        <button class="new-group-btn" id="openCreateRoomBtn" onclick="openCreateRoomModal()">＋ 建立群組</button>
        <div class="theme-switch" role="button" tabindex="0" aria-label="切換明暗主題" onclick="toggleTheme()" onkeydown="if(event.key==='Enter'||event.key===' ')toggleTheme()">
          <span class="theme-switch-label label-light">LIGHT</span>
          <div class="theme-switch-knob"></div>
          <span class="theme-switch-label label-dark">DARK</span>
        </div>
      </div>

      <div class="search-box">
        <input type="text" id="contactSearchInput" placeholder="🔍 搜尋群組、座號或姓名..." oninput="renderThreadList()">
      </div>

      <div class="thread-list" id="threadList">
        <div style="padding:1rem; color:var(--text-muted); font-size:0.86rem;">正在載入訊息列表...</div>
      </div>
    </div>

    <div class="ig-main">
      <div class="chat-header">
        <button class="mobile-back-btn" onclick="closeMobileChat()">‹</button>
        <div class="avatar-wrap">
          <div class="avatar group-av" id="activeAvatar">📢</div>
          <span class="online-dot" id="activeOnlineDot" style="display:none;"></span>
        </div>
        <div class="chat-title-wrap">
          <div class="chat-title" id="activeChatTitle">國二-2 班級大群</div>
          <div class="chat-subtitle" id="activeChatSubtitle">全班同學與導師共同討論區</div>
        </div>
        <button class="room-settings-btn" id="roomSettingsBtn" onclick="openRoomInfoModal()">⚙️ 群組資訊</button>
      </div>

      <div class="messages-area" id="messagesArea">
        <div style="text-align:center; color:var(--text-muted); margin-top:2rem;">載入訊息中...</div>
      </div>

      <!-- 回覆特定訊息預覽條 -->
      <div class="reply-preview-bar" id="replyPreviewBar">
        <div class="reply-preview-info">
          <div class="reply-preview-title" id="replyPreviewTitle">回覆對象</div>
          <div class="reply-preview-snippet" id="replyPreviewSnippet">訊息內容...</div>
        </div>
        <button type="button" class="modal-close" style="font-size:1.1rem;" onclick="cancelReply()">✕</button>
      </div>

      <div class="chat-input-bar" id="chatInputBar">
        <div class="media-btns-wrap" id="mediaBtnsWrap">
          <button type="button" class="media-btn camera-only-btn" id="cameraBtn" title="拍照傳送" onclick="document.getElementById('cameraInput').click()">📷</button>
          <button type="button" class="media-btn" title="選擇圖片上傳" onclick="document.getElementById('galleryInput').click()">🖼️</button>
          <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="handleImageUpload(this)">
          <input type="file" id="galleryInput" accept="image/*" style="display:none;" onchange="handleImageUpload(this)">
        </div>

        <input type="text" id="messageInput" maxlength="500" placeholder="輸入訊息（電腦可直接貼上圖片）..." autocomplete="off" onkeydown="handleInputKeydown(event)" onpaste="handlePasteImage(event)">
        <button type="button" class="send-btn" id="sendBtn" onclick="sendMessage()">傳送</button>
      </div>
    </div>
  </div>

  <script>
    function applyTheme(theme) {
      if (theme === 'light') document.documentElement.setAttribute('data-theme', 'light');
      else document.documentElement.removeAttribute('data-theme');
    }
    function toggleTheme() {
      const next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
      localStorage.setItem('nexus-theme', next);
      applyTheme(next);
    }
    applyTheme(localStorage.getItem('nexus-theme') || 'dark');

    const SUPABASE_URL = 'https://udtaqnkdohkfzkyzkmwd.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_Y_GZnXSJAUmTEPvTR-jX0Q_og4LybPV';
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let me = null;
    let isDevAuditor = false;
    let contacts = [];
    let allStudents = [];
    let userMap = {};
    let onlineUserIds = new Set();
    let customRooms = [];
    let roomMembersMap = {};
    let groupLastReadAt = '1970-01-01T00:00:00Z';
    let studentGroupLastReadAt = '1970-01-01T00:00:00Z';
    let allMessages = [];
    let activeChannel = { type: 'group', targetUser: null, pairUsers: null, roomId: null };
    let replyingTo = null;
    let isSending = false;

    function isMobileDevice() {
      return window.matchMedia('(max-width: 768px) and (pointer: coarse)').matches || /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    }

    function goBackPortal() {
      if (me && (me.role === 'admin' || isDevAuditor)) {
        window.location.href = 'admin.html';
      } else {
        window.location.href = 'student.html';
      }
    }

    function closeMobileChat() {
      document.getElementById('igShell').classList.remove('mobile-chat-open');
    }

    function handleInputKeydown(e) {
      if (e.isComposing || e.keyCode === 229) return;
      if (e.key === 'Enter') {
        e.preventDefault();
        sendMessage();
      } else if (e.key === 'Escape' && replyingTo) {
        cancelReply();
      }
    }

    function openLightbox(url) {
      document.getElementById('lightboxImg').src = url;
      document.getElementById('imgLightbox').style.display = 'flex';
    }

    function setReplyTarget(msgId) {
      if (isDevAuditor) return;
      const msg = allMessages.find(m => m.id === msgId);
      if (!msg) return;

      let senderLabel = msg.sender_role === 'admin'
        ? `${msg.sender_name}(導師)`
        : `${msg.sender_seat ?? '-'}號 ${msg.sender_name}`;
      if (activeChannel.type === 'room') {
        senderLabel = getRoomDisplayName(activeChannel.roomId, msg.sender_id);
      }

      const snippet = msg.image_url
        ? (msg.content ? `[圖片] ${msg.content}` : '[圖片]')
        : msg.content;

      replyingTo = {
        id: msg.id,
        sender: senderLabel,
        snippet: snippet.slice(0, 80)
      };

      document.getElementById('replyPreviewTitle').innerText = `↩️ 回覆 ${replyingTo.sender}`;
      document.getElementById('replyPreviewSnippet').innerText = replyingTo.snippet;
      document.getElementById('replyPreviewBar').style.display = 'flex';
      document.getElementById('messageInput').focus();
    }

    function cancelReply() {
      replyingTo = null;
      document.getElementById('replyPreviewBar').style.display = 'none';
    }

    function scrollToMessage(msgId) {
      const targetEl = document.getElementById(`msg-item-${msgId}`);
      if (!targetEl) return;
      targetEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      targetEl.classList.add('highlight-flash');
      setTimeout(() => targetEl.classList.remove('highlight-flash'), 1200);
    }

    async function init() {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (!session) {
        window.location.href = 'index.html';
        return;
      }

      const { data: myProfile } = await supabaseClient
        .from('profiles')
        .select('id, seat_number, name, role, email')
        .eq('id', session.user.id)
        .single();

      if (!myProfile || myProfile.role === 'parent') {
        alert('此功能僅限班級成員使用！');
        window.location.href = 'index.html';
        return;
      }

      me = myProfile;
      isDevAuditor = me.role === 'developer' || (me.email || '').toLowerCase() === '202020@cysh.khc.edu.tw';

      if (isDevAuditor) {
        document.getElementById('openCreateRoomBtn').style.display = 'none';
        document.getElementById('chatInputBar').innerHTML =
          '<div class="readonly-banner">👁️ 系統管理員隱形唯讀模式（可檢視所有群組與私聊紀錄，無法發言或創群）</div>';
      } else if (!isMobileDevice()) {
        const camBtn = document.getElementById('cameraBtn');
        if (camBtn) camBtn.remove();
      }

      const { data: users } = await supabaseClient
        .from('profiles')
        .select('id, seat_number, name, role, email')
        .in('role', ['student', 'admin'])
        .order('seat_number', { ascending: true });

      const visibleMembers = (users || []).filter(u => (u.email || '').toLowerCase() !== '202020@cysh.khc.edu.tw');
      visibleMembers.forEach(u => { userMap[u.id] = u; });

      allStudents = visibleMembers.filter(u => u.role === 'student');
      contacts = visibleMembers.filter(u => u.id !== me.id);

      await Promise.all([loadRoomsAndMembers(), loadGroupReadStatus(), loadAllMessages()]);
      await selectGroupChannel(false);
      subscribeRealtime();
    }

    async function loadGroupReadStatus() {
      if (isDevAuditor) return;
      const { data } = await supabaseClient
        .from('chat_group_reads')
        .select('last_read_at, student_group_last_read_at')
        .eq('user_id', me.id)
        .maybeSingle();

      if (data) {
        if (data.last_read_at) groupLastReadAt = data.last_read_at;
        if (data.student_group_last_read_at) studentGroupLastReadAt = data.student_group_last_read_at;
      }
    }

    async function markGroupAsRead() {
      if (isDevAuditor) return;
      const nowIso = new Date().toISOString();
      groupLastReadAt = nowIso;
      renderThreadList();
      await supabaseClient
        .from('chat_group_reads')
        .upsert({
          user_id: me.id,
          last_read_at: groupLastReadAt,
          student_group_last_read_at: studentGroupLastReadAt
        });
    }

    async function markStudentGroupAsRead() {
      if (isDevAuditor || me.role !== 'student') return;
      const nowIso = new Date().toISOString();
      studentGroupLastReadAt = nowIso;
      renderThreadList();
      await supabaseClient
        .from('chat_group_reads')
        .upsert({
          user_id: me.id,
          last_read_at: groupLastReadAt,
          student_group_last_read_at: studentGroupLastReadAt
        });
    }

    async function markRoomAsRead(roomId) {
      if (isDevAuditor) return;
      const nowIso = new Date().toISOString();
      const members = roomMembersMap[roomId] || [];
      const myMem = members.find(m => m.user_id === me.id);
      if (myMem) myMem.last_read_at = nowIso;
      renderThreadList();
      renderActiveMessages();
      await supabaseClient
        .from('chat_room_members')
        .update({ last_read_at: nowIso })
        .eq('room_id', roomId)
        .eq('user_id', me.id);
    }

    async function loadRoomsAndMembers() {
      const { data: rooms } = await supabaseClient
        .from('chat_rooms')
        .select('*')
        .order('created_at', { ascending: false });

      customRooms = rooms || [];

      const { data: members } = await supabaseClient
        .from('chat_room_members')
        .select('room_id, user_id, nickname, last_read_at');

      roomMembersMap = {};
      (members || []).forEach(m => {
        if (!roomMembersMap[m.room_id]) roomMembersMap[m.room_id] = [];
        roomMembersMap[m.room_id].push(m);
      });
    }

    async function loadAllMessages() {
      const { data, error } = await supabaseClient
        .from('chat_messages')
        .select('*')
        .order('created_at', { ascending: true })
        .limit(1000);

      if (!error && data) {
        allMessages = data;
        renderThreadList();
        renderActiveMessages();
      }
    }

    function subscribeRealtime() {
      const channel = supabaseClient.channel('nexus-direct-realtime', {
        config: { presence: { key: me.id } }
      });

      channel
        .on('presence', { event: 'sync' }, () => {
          const state = channel.presenceState();
          onlineUserIds = new Set(Object.keys(state));
          updateHeaderOnlineStatus();
          renderThreadList();
        })
        .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'chat_messages' }, payload => {
          const newMsg = payload.new;
          if (!allMessages.some(m => m.id === newMsg.id)) {
            allMessages.push(newMsg);
          }

          if (!isDevAuditor) {
            if (activeChannel.type === 'group' && newMsg.channel_type === 'group') {
              markGroupAsRead();
            } else if (activeChannel.type === 'student_group' && newMsg.channel_type === 'student_group') {
              markStudentGroupAsRead();
            } else if (activeChannel.type === 'room' && newMsg.channel_type === 'room' && newMsg.room_id === activeChannel.roomId) {
              markRoomAsRead(activeChannel.roomId);
            } else if (
              activeChannel.type === 'dm' &&
              activeChannel.targetUser &&
              newMsg.channel_type === 'dm' &&
              newMsg.sender_id === activeChannel.targetUser.id &&
              newMsg.receiver_id === me.id
            ) {
              markDmAsRead(activeChannel.targetUser.id);
            }
          }

          renderThreadList();
          renderActiveMessages();
        })
        .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'chat_messages' }, payload => {
          const updated = payload.new;
          const idx = allMessages.findIndex(m => m.id === updated.id);
          if (idx !== -1) {
            allMessages[idx] = updated;
            renderThreadList();
            renderActiveMessages();
          }
        })
        .on('postgres_changes', { event: 'DELETE', schema: 'public', table: 'chat_messages' }, payload => {
          allMessages = allMessages.filter(m => m.id !== payload.old.id);
          renderThreadList();
          renderActiveMessages();
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_rooms' }, async () => {
          await loadRoomsAndMembers();
          if (activeChannel.type === 'room' && !customRooms.some(r => r.id === activeChannel.roomId)) {
            selectGroupChannel(false);
          } else {
            renderThreadList();
          }
        })
        .on('postgres_changes', { event: '*', schema: 'public', table: 'chat_room_members' }, async () => {
          await loadRoomsAndMembers();
          if (activeChannel.type === 'room') {
            const mems = roomMembersMap[activeChannel.roomId] || [];
            if (!isDevAuditor && !mems.some(m => m.user_id === me.id)) {
              selectGroupChannel(false);
              return;
            }
            updateRoomHeaderSubtitle(activeChannel.roomId);
            renderActiveMessages();
          }
          renderThreadList();
        })
        .subscribe(async status => {
          if (status === 'SUBSCRIBED' && !isDevAuditor) {
            await channel.track({ online_at: new Date().toISOString() });
          }
        });
    }

    function updateHeaderOnlineStatus() {
      const dot = document.getElementById('activeOnlineDot');
      const sub = document.getElementById('activeChatSubtitle');

      if (activeChannel.type === 'dm' && activeChannel.targetUser) {
        const isOnline = onlineUserIds.has(activeChannel.targetUser.id);
        dot.style.display = isOnline ? 'block' : 'none';
        sub.innerText = isOnline ? '🟢 目前在線上・1 對 1 私人訊息' : '⚫ 離線・1 對 1 私人訊息';
      } else {
        dot.style.display = 'none';
      }
    }

    function openCreateRoomModal() {
      if (isDevAuditor) return;
      document.getElementById('newRoomNameInput').value = '';
      const listEl = document.getElementById('memberChecklist');
      listEl.innerHTML = contacts.map(c => {
        const isTeacher = c.role === 'admin';
        const label = isTeacher ? `👑 ${c.name}（導師）` : `${c.seat_number ?? '-'}號 ${c.name}`;
        return `
          <label class="member-check-item">
            <div style="display:flex; align-items:center; gap:0.6rem;">
              <input type="checkbox" value="${c.id}">
              <span>${escapeHtml(label)}</span>
            </div>
          </label>
        `;
      }).join('');
      document.getElementById('createRoomModal').style.display = 'flex';
    }

    function closeCreateRoomModal() {
      document.getElementById('createRoomModal').style.display = 'none';
    }

    async function createCustomRoom() {
      if (isDevAuditor) return;
      const roomName = document.getElementById('newRoomNameInput').value.trim();
      if (!roomName) {
        alert('請輸入群組名稱！');
        return;
      }

      const checkedBoxes = Array.from(document.querySelectorAll('#memberChecklist input[type="checkbox"]:checked'));
      const selectedIds = checkedBoxes.map(cb => cb.value);

      if (selectedIds.length === 0) {
        alert('請至少勾選 1 位同學或導師加入群組！');
        return;
      }

      const { data: roomData, error: roomErr } = await supabaseClient
        .from('chat_rooms')
        .insert([{ name: roomName, created_by: me.id }])
        .select()
        .single();

      if (roomErr || !roomData) {
        alert('建立群組失敗：' + (roomErr ? roomErr.message : '未知錯誤'));
        return;
      }

      const memberIds = Array.from(new Set([me.id, ...selectedIds]));
      const memberRows = memberIds.map(uid => ({ room_id: roomData.id, user_id: uid }));

      const { error: memErr } = await supabaseClient
        .from('chat_room_members')
        .insert(memberRows);

      if (memErr) {
        alert('加入群組成員失敗：' + memErr.message);
        return;
      }

      closeCreateRoomModal();
      await loadRoomsAndMembers();
      await selectCustomRoom(roomData.id, true);
    }

    function getRoomDisplayName(roomId, uid) {
      const mems = roomMembersMap[roomId] || [];
      const mem = mems.find(m => m.user_id === uid);
      const u = userMap[uid];
      const baseName = u ? (u.role === 'admin' ? `${u.name}(導師)` : `${u.seat_number ?? '-'}號${u.name}`) : '未知成員';
      if (mem && mem.nickname && mem.nickname.trim()) {
        return `${mem.nickname.trim()}（${baseName}）`;
      }
      return baseName;
    }

    function openRoomInfoModal() {
      if (activeChannel.type !== 'room' || !activeChannel.roomId) return;
      const room = customRooms.find(r => r.id === activeChannel.roomId);
      if (!room) return;

      const isOwner = !isDevAuditor && room.created_by === me.id;
      const currentMembers = roomMembersMap[room.id] || [];
      const myMem = currentMembers.find(m => m.user_id === me.id);
      const creatorLabel = formatUserShort(userMap[room.created_by]);

      let html = `
        <div style="font-size:0.82rem; color:var(--text-muted); margin-bottom:0.85rem;">
          建立者：<strong style="color:var(--text-main);">${escapeHtml(creatorLabel)}</strong>
        </div>
      `;

      if (!isDevAuditor && myMem) {
        html += `
          <div style="margin-bottom:1rem;">
            <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:0.35rem;">我在本群的專屬暱稱（留空則顯示本名）：</div>
            <div style="display:flex; gap:0.5rem;">
              <input type="text" id="myRoomNicknameInput" class="modal-input" style="margin-bottom:0;" maxlength="20" placeholder="例如：數學小老師" value="${escapeHtml(myMem.nickname || '')}">
              <button class="send-btn" style="border-radius:10px; padding:0 1rem;" onclick="updateMyRoomNickname(${room.id})">套用</button>
            </div>
          </div>
        `;
      }

      if (isOwner) {
        html += `
          <div style="margin-bottom:1rem;">
            <div style="font-size:0.8rem; color:var(--text-muted); margin-bottom:0.35rem;">修改小群組名稱：</div>
            <div style="display:flex; gap:0.5rem;">
              <input type="text" id="editRoomNameInput" class="modal-input" style="margin-bottom:0;" maxlength="30" value="${escapeHtml(room.name)}">
              <button class="send-btn" style="border-radius:10px; padding:0 1rem;" onclick="renameCustomRoom(${room.id})">儲存</button>
            </div>
          </div>
        `;
      }

      html += `<div style="font-size:0.82rem; color:var(--text-muted); margin-bottom:0.45rem;">目前成員（${currentMembers.length} 人）：</div>`;
      html += `<div class="member-checklist">`;
      html += currentMembers.map(m => {
        const uid = m.user_id;
        const label = getRoomDisplayName(room.id, uid);
        const isCreator = uid === room.created_by;
        const isOnline = onlineUserIds.has(uid);
        return `
          <div class="member-check-item" style="cursor:default;">
            <span>${isOnline ? '🟢' : '⚫'} ${escapeHtml(label)} ${isCreator ? '<span class="role-pill">群主</span>' : ''}</span>
            ${(isOwner && !isCreator) ? `<button class="danger-btn" style="padding:0.25rem 0.6rem; font-size:0.75rem;" onclick="removeMemberFromRoom(${room.id}, '${uid}')">移出</button>` : ''}
          </div>
        `;
      }).join('');
      html += `</div>`;

      if (isOwner) {
        const currentIds = currentMembers.map(m => m.user_id);
        const nonMembers = contacts.filter(c => !currentIds.includes(c.id));
        if (nonMembers.length > 0) {
          html += `
            <div style="font-size:0.82rem; color:var(--text-muted); margin-bottom:0.45rem;">邀請新成員加入：</div>
            <div style="display:flex; gap:0.5rem; margin-bottom:1rem;">
              <select id="addMemberSelect" class="modal-input" style="margin-bottom:0;">
                ${nonMembers.map(c => `<option value="${c.id}">${escapeHtml(formatUserShort(c))}</option>`).join('')}
              </select>
              <button class="send-btn" style="border-radius:10px; padding:0 1rem;" onclick="addMemberToRoom(${room.id})">＋邀請</button>
            </div>
          `;
        }
        html += `<button class="danger-btn" style="width:100%;" onclick="deleteCustomRoom(${room.id})">🗑️ 解散並刪除此群組</button>`;
      } else if (!isDevAuditor) {
        html += `<button class="danger-btn" style="width:100%;" onclick="leaveCustomRoom(${room.id})">🚪 退出此群組</button>`;
      }

      document.getElementById('roomInfoBody').innerHTML = html;
      document.getElementById('roomInfoModal').style.display = 'flex';
    }

    function closeRoomInfoModal() {
      document.getElementById('roomInfoModal').style.display = 'none';
    }

    async function updateMyRoomNickname(roomId) {
      if (isDevAuditor) return;
      const nick = document.getElementById('myRoomNicknameInput').value.trim();
      const { error } = await supabaseClient
        .from('chat_room_members')
        .update({ nickname: nick || null })
        .eq('room_id', roomId)
        .eq('user_id', me.id);

      if (error) return alert('更新暱稱失敗：' + error.message);

      await loadRoomsAndMembers();
      updateRoomHeaderSubtitle(roomId);
      renderActiveMessages();
      openRoomInfoModal();
    }

    async function renameCustomRoom(roomId) {
      const newName = document.getElementById('editRoomNameInput').value.trim();
      if (!newName) return alert('群組名稱不可為空！');

      const { error } = await supabaseClient
        .from('chat_rooms')
        .update({ name: newName })
        .eq('id', roomId);

      if (error) return alert('改名失敗：' + error.message);

      await loadRoomsAndMembers();
      document.getElementById('activeChatTitle').innerText = newName;
      renderThreadList();
      openRoomInfoModal();
    }

    async function addMemberToRoom(roomId) {
      const selectEl = document.getElementById('addMemberSelect');
      const targetUid = selectEl ? selectEl.value : null;
      if (!targetUid) return;

      const { error } = await supabaseClient
        .from('chat_room_members')
        .insert([{ room_id: roomId, user_id: targetUid }]);

      if (error) return alert('邀請失敗：' + error.message);

      await loadRoomsAndMembers();
      updateRoomHeaderSubtitle(roomId);
      renderThreadList();
      openRoomInfoModal();
    }

    async function removeMemberFromRoom(roomId, targetUid) {
      if (!confirm('確定要將此成員移出群組嗎？')) return;
      const { error } = await supabaseClient
        .from('chat_room_members')
        .delete()
        .eq('room_id', roomId)
        .eq('user_id', targetUid);

      if (error) return alert('移出失敗：' + error.message);

      await loadRoomsAndMembers();
      updateRoomHeaderSubtitle(roomId);

        .filter(m => m.channel_type === 'dm' && m.sender_id === senderId && m.receiver_id === me.id && !m.is_read)

          ? `👑 ${m.sender_name}（導師）`

      area.scrollTop = area.scrollHeight;
    }

    async function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            const maxSide = 1280;
            let { width, height } = img;
            if (width > maxSide || height > maxSide) {
              if (width > height) {
                height = Math.round((height * maxSide) / width);
                width = maxSide;
              } else {
                width = Math.round((width * maxSide) / height);
                height = maxSide;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob(blob => {
              if (blob) resolve(blob);
              else reject(new Error('圖片壓縮失敗'));
            }, 'image/jpeg', 0.8);
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    async function uploadAndSendImageFile(file) {
      if (isDevAuditor || !file) return;

      const msgInput = document.getElementById('messageInput');
      const oldPlaceholder = msgInput.placeholder;
      msgInput.placeholder = '正在上傳圖片...';
      msgInput.disabled = true;

      try {
        const compressedBlob = await compressImageFile(file);
        const filePath = `${me.id}/${Date.now()}_${Math.random().toString(36).slice(2, 7)}.jpg`;

        const { error: uploadErr } = await supabaseClient.storage
          .from('chat-images')
          .upload(filePath, compressedBlob, { contentType: 'image/jpeg' });

        if (uploadErr) {
          alert('圖片上傳失敗：' + uploadErr.message);
          return;
        }

        const { data: pubData } = supabaseClient.storage
          .from('chat-images')
          .getPublicUrl(filePath);

        const payload = {
          channel_type: activeChannel.type,
          sender_id: me.id,
          sender_name: me.name || '成員',
          sender_seat: me.seat_number ?? null,
          sender_role: me.role,
          receiver_id: activeChannel.type === 'dm' ? activeChannel.targetUser.id : null,
          room_id: activeChannel.type === 'room' ? activeChannel.roomId : null,
          content: '',
          image_url: pubData.publicUrl,
          reply_to_id: replyingTo ? replyingTo.id : null,
          reply_to_sender: replyingTo ? replyingTo.sender : null,
          reply_to_content: replyingTo ? replyingTo.snippet : null
        };

        cancelReply();

        const { data, error } = await supabaseClient
          .from('chat_messages')
          .insert([payload])
          .select()
          .single();

        if (error) {
          alert('傳送圖片訊息失敗：' + error.message);
          return;
        }

        if (data && !allMessages.some(m => m.id === data.id)) {
          allMessages.push(data);
          renderThreadList();
          renderActiveMessages();
        }
      } catch (err) {
        alert('處理圖片時發生錯誤：' + err.message);
      } finally {
        msgInput.disabled = false;
        msgInput.placeholder = oldPlaceholder;
      }
    }

    async function handleImageUpload(fileInput) {
      const file = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if (file) await uploadAndSendImageFile(file);
    }

    async function handlePasteImage(e) {
      if (isDevAuditor) return;
      const items = (e.clipboardData || window.clipboardData)?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.indexOf('image') !== -1) {
          e.preventDefault();
          const file = item.getAsFile();
          if (file) await uploadAndSendImageFile(file);
          break;
        }
      }
    }

    async function sendMessage() {
      if (isDevAuditor || isSending) return;

      const input = document.getElementById('messageInput');
      const content = input.value.trim();
      if (!content) return;

      isSending = true;

      const currentReply = replyingTo;
      cancelReply();

      input.value = '';
      input.blur();
      requestAnimationFrame(() => {
        input.value = '';
        input.focus();
      });

      const payload = {
        channel_type: activeChannel.type,
        sender_id: me.id,
        sender_name: me.name || '成員',
        sender_seat: me.seat_number ?? null,
        sender_role: me.role,
        receiver_id: activeChannel.type === 'dm' ? activeChannel.targetUser.id : null,
        room_id: activeChannel.type === 'room' ? activeChannel.roomId : null,
        content,
        reply_to_id: currentReply ? currentReply.id : null,
        reply_to_sender: currentReply ? currentReply.sender : null,
        reply_to_content: currentReply ? currentReply.snippet : null
      };

      try {
        const { data, error } = await supabaseClient
          .from('chat_messages')
          .insert([payload])
          .select()
          .single();

        if (error) {
          alert('傳送失敗：' + error.message);
          input.value = content;
          return;
        }

        if (data && !allMessages.some(m => m.id === data.id)) {
          allMessages.push(data);
          renderThreadList();
          renderActiveMessages();
        }
      } finally {
        isSending = false;
      }
    }

    async function deleteMessage(msgId) {
      if (!confirm('確定要收回 / 刪除此則訊息嗎？')) return;
      const { error } = await supabaseClient
        .from('chat_messages')
        .delete()
        .eq('id', msgId);

      if (error) {
        alert('刪除失敗：' + error.message);
      } else {
        allMessages = allMessages.filter(m => m.id !== msgId);
        renderThreadList();
        renderActiveMessages();
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    init();
  </script>
</body>
