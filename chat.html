                  <div class="thread-preview">${escapeHtml(preview)}</div>
                </div>
                ${roomUnread > 0 ? `<span class="unread-badge">${roomUnread}</span>` : ''}
              </div>
            `;
          }).join('');
        }
      }

      const filtered = contacts.filter(c => {
        if (!keyword) return true;
        const seatStr = String(c.seat_number ?? '');
        const nickStr = (c.nickname || '').toLowerCase();
        return seatStr.includes(keyword) || (c.name || '').toLowerCase().includes(keyword) || nickStr.includes(keyword);
      });

      const pinnedList = pinnedContactIds
        .map(pid => filtered.find(c => c.id === pid))
        .filter(Boolean);

      if (pinnedList.length > 0) {
        html += `<div class="section-label">📌 置頂聯絡對象（${pinnedList.length}/3）</div>`;
        html += pinnedList.map(c => buildContactItemHtml(c, true, now)).join('');
      }

      const unpinnedList = filtered.filter(c => !pinnedContactIds.includes(c.id));

      // 優先顯示導師與系統開發者
      const staffContacts = unpinnedList.filter(c => isStaffProfile(c));
      if (staffContacts.length > 0) {
        html += `<div class="section-label">👑 導師與系統開發者專線（支援語音通話）</div>`;
        html += staffContacts.map(c => buildContactItemHtml(c, false, now)).join('');
      }

      // 若登入者是導師或開發者，下方列出本班學生與家長
      if (isStaffUser) {
        const studentContacts = unpinnedList.filter(c => c.role === 'student');
        const parentContacts = unpinnedList.filter(c => c.role === 'parent');

        if (studentContacts.length > 0) {
          html += `<div class="section-label">🎒 本班學生名單（${studentContacts.length} 人）</div>`;
          html += studentContacts.map(c => buildContactItemHtml(c, false, now)).join('');
        }
        if (parentContacts.length > 0) {
          html += `<div class="section-label">👪 本班家長名單（${parentContacts.length} 人）</div>`;
          html += parentContacts.map(c => buildContactItemHtml(c, false, now)).join('');
        }
      }

      listEl.innerHTML = html;
    }

    function formatMessageTextWithMentions(rawText) {
      const escaped = escapeHtml(rawText);
      return escaped.replace(/(@[^\s@<]+)/g, '<span class="mention-highlight">$1</span>');
    }

    function loadMoreMessages() {
      visibleMsgLimit += 40;
      renderActiveMessages(false);
    }

    function renderActiveMessages(scrollToBottom = true) {
      const area = document.getElementById('messagesArea');
      let msgs = [];

      if (activeChannel.type === 'group') {
        msgs = allMessages.filter(m => m.channel_type === 'group');
      } else if (activeChannel.type === 'room' && activeChannel.roomId) {
        msgs = allMessages.filter(m => m.channel_type === 'room' && m.room_id === activeChannel.roomId);
      } else if (activeChannel.type === 'dm' && activeChannel.targetUser) {
        const tid = activeChannel.targetUser.id;
        msgs = allMessages.filter(m =>
          m.channel_type === 'dm' &&
          ((m.sender_id === me.id && m.receiver_id === tid) || (m.sender_id === tid && m.receiver_id === me.id))
        );
      }

      if (msgs.length === 0) {
        area.innerHTML = '<div style="text-align:center; color:var(--text-muted); margin-top:2.5rem; font-size:0.88rem;">目前還沒有訊息紀錄，輸入文字或點擊右上角「📞 語音通話」即可開始聯絡</div>';
        return;
      }

      const hasMore = msgs.length > visibleMsgLimit;
      const displayedMsgs = hasMore ? msgs.slice(msgs.length - visibleMsgLimit) : msgs;

      const canModDelete = isStaffUser;
      const canPin = canPinInActiveChannel();
      const roomMembers = activeChannel.type === 'room' ? (roomMembersMap[activeChannel.roomId] || []) : [];

      let html = '';
      if (hasMore) {
        html += `
          <div class="load-more-wrap">
            <button type="button" class="load-more-btn" onclick="loadMoreMessages()">⬆️ 載入更早的歷史訊息（還有 ${msgs.length - visibleMsgLimit} 則）</button>
          </div>
        `;
      }

      html += displayedMsgs.map(m => {
        const isMine = m.sender_id === me.id;
        const dt = new Date(m.created_at);
        const timeStr = `${String(dt.getHours()).padStart(2, '0')}:${String(dt.getMinutes()).padStart(2, '0')}`;
        const canEditThis = isMine && (Date.now() - dt.getTime() <= 3 * 60 * 1000);

        const senderObj = userMap[m.sender_id];
        let senderLabel = senderObj
          ? (isDeveloperProfile(senderObj) ? `🛠️ ${formatUserFullLabel(senderObj)}` : isTeacherRole(senderObj.role) ? `👑 ${formatUserFullLabel(senderObj)}` : formatUserFullLabel(senderObj))
          : (isTeacherRole(m.sender_role) ? `👑 ${m.sender_name}（導師）` : `${m.sender_seat ?? '-'}號 ${m.sender_name}`);
        if (activeChannel.type === 'room') {
          senderLabel = getRoomDisplayName(activeChannel.roomId, m.sender_id);
        }

        const showSenderName = !isMine && (
          activeChannel.type === 'group' ||
          activeChannel.type === 'room'
        );

        let readReceiptHtml = '';
        if (isMine) {
          if (activeChannel.type === 'dm' && m.is_read) {
            readReceiptHtml = '<span class="read-receipt">已讀</span>';
          } else if (activeChannel.type === 'room') {
            const readCount = roomMembers.filter(rm =>
              rm.user_id !== me.id &&
              rm.last_read_at &&
              new Date(rm.last_read_at) >= new Date(m.created_at)
            ).length;
            if (readCount > 0) {
              readReceiptHtml = `<span class="read-receipt">已讀 ${readCount}</span>`;
            }
          }
        }

        const quoteHtml = (m.reply_to_sender || m.reply_to_content)
          ? `<div class="reply-quote-box" onclick="${m.reply_to_id ? `scrollToMessage(${m.reply_to_id})` : ''}"><div class="reply-quote-sender">↩️ ${escapeHtml(m.reply_to_sender || '原訊息')}</div><div class="reply-quote-text">${escapeHtml(m.reply_to_content || '')}</div></div>`
          : '';

        const imgHtml = m.image_url
          ? `<img src="${escapeHtml(m.image_url)}" class="chat-img" alt="聊天圖片" onclick="openLightbox('${escapeHtml(m.image_url)}')">`
          : '';
        const textHtml = m.content ? `<div style="white-space:pre-wrap; ${m.image_url ? 'margin-top:0.4rem;' : ''}">${formatMessageTextWithMentions(m.content)}</div>` : '';
        const isImgOnly = m.image_url && !m.content && !quoteHtml;

        const reactionsObj = typeof m.reactions === 'object' && m.reactions !== null ? m.reactions : {};
        const reactionPillsHtml = Object.entries(reactionsObj)
          .filter(([, users]) => Array.isArray(users) && users.length > 0)
          .map(([emoji, users]) => {
            const reactedByMe = users.includes(me.id);
            return `<button type="button" class="reaction-pill ${reactedByMe ? 'reacted-by-me' : ''}" onclick="toggleReaction(${m.id}, '${emoji}')">${emoji} ${users.length}</button>`;
          }).join('');

        const emojiPickerHtml = `
          <div class="emoji-picker-bar">
            ${EMOJI_OPTIONS.map(em => `<button type="button" class="emoji-opt-btn" onclick="toggleReaction(${m.id}, '${em}')">${em}</button>`).join('')}
          </div>
        `;

        return `
          <div class="msg-row ${isMine ? 'mine' : 'others'}" id="msg-item-${m.id}">
            ${showSenderName ? `<div class="msg-sender">${escapeHtml(senderLabel)}</div>` : ''}
            <div class="msg-bubble-wrap">
              <div class="msg-bubble ${isImgOnly ? 'img-only' : ''}">${quoteHtml}${imgHtml}${textHtml}</div>
              <div class="msg-actions">
                ${emojiPickerHtml}
                <button class="action-icon-btn" title="回覆此訊息" onclick="setReplyTarget(${m.id})">↩️</button>
                ${canPin ? `<button class="action-icon-btn" title="設為頻道置頂公告" onclick="pinMessageToChannel(${m.id})">📌</button>` : ''}
                ${canEditThis ? `<button class="action-icon-btn" title="編輯訊息（3分鐘內）" onclick="editMessage(${m.id})">✏️</button>` : ''}
                ${(isMine || canModDelete) ? `<button class="action-icon-btn del-btn" title="收回/刪除訊息" onclick="deleteMessage(${m.id})">✕</button>` : ''}
              </div>
            </div>
            ${reactionPillsHtml ? `<div class="reaction-pills-row">${reactionPillsHtml}</div>` : ''}
            <div class="msg-meta">
              ${readReceiptHtml}
              ${m.edited_at ? '<span>(已編輯)</span>' : ''}
              <span>${timeStr}</span>
            </div>
          </div>
        `;
      }).join('');

      area.innerHTML = html;
      if (scrollToBottom) {
        area.scrollTop = area.scrollHeight;
      }
    }

    async function compressImageFile(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = ev => {
          const img = new Image();
          img.onload = () => {
            const maxSide = 1280;
            let { width, height } = img;
            if (width > maxSide || height > maxSide) {
              if (width > height) {
                height = Math.round((height * maxSide) / width);
                width = maxSide;
              } else {
                width = Math.round((width * maxSide) / height);
                height = maxSide;
              }
            }
            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            canvas.toBlob(blob => {
              if (blob) resolve(blob);
              else reject(new Error('圖片壓縮失敗'));
            }, 'image/jpeg', 0.8);
          };
          img.onerror = reject;
          img.src = ev.target.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    function openImagePreviewModal(file) {
      if (!file) return;
      pendingImageFile = file;
      const reader = new FileReader();
      reader.onload = ev => {
        document.getElementById('pendingPreviewImg').src = ev.target.result;
        document.getElementById('pendingImageCaption').value = '';
        document.getElementById('imagePreviewModal').style.display = 'flex';
        setTimeout(() => document.getElementById('pendingImageCaption').focus(), 50);
      };
      reader.readAsDataURL(file);
    }

    function closeImagePreviewModal() {
      pendingImageFile = null;
      document.getElementById('imagePreviewModal').style.display = 'none';
    }

    async function confirmSendPendingImage() {
      if (!pendingImageFile) return;
      const fileToUpload = pendingImageFile;
      const caption = document.getElementById('pendingImageCaption').value.trim();
      closeImagePreviewModal();
      await uploadAndSendImageFile(fileToUpload, caption);
    }

    async function uploadAndSendImageFile(file, caption = '') {
      if (!file) return;
      if (!isStaffUser && !classSwitches.is_chat_enabled) {
        alert('導師目前已暫停一般訊息發送！');
        return;
      }

      const msgInput = document.getElementById('messageInput');
      const oldPlaceholder = msgInput ? msgInput.placeholder : '';
      if (msgInput) {
        msgInput.placeholder = '正在上傳圖片...';
        msgInput.disabled = true;
      }

      try {
        const compressedBlob = await compressImageFile(file);
        const filePath = `${me.id}/${Date.now()}_${Math.random().toString(36).slice(2, 7)}.jpg`;

        const { error: uploadErr } = await supabaseClient.storage
          .from('chat-images')
          .upload(filePath, compressedBlob, { contentType: 'image/jpeg' });

        if (uploadErr) {
          alert('圖片上傳失敗：' + uploadErr.message);
          return;
        }

        const { data: pubData } = supabaseClient.storage
          .from('chat-images')
          .getPublicUrl(filePath);

        const payload = {
          channel_type: activeChannel.type,
          class_name: currentClassName,
          sender_id: me.id,
          sender_name: me.name || '成員',
          sender_seat: me.seat_number ?? null,
          sender_role: me.role,
          receiver_id: activeChannel.type === 'dm' ? activeChannel.targetUser.id : null,
          room_id: activeChannel.type === 'room' ? activeChannel.roomId : null,
          content: caption,
          image_url: pubData.publicUrl,
          reply_to_id: replyingTo ? replyingTo.id : null,
          reply_to_sender: replyingTo ? replyingTo.sender : null,
          reply_to_content: replyingTo ? replyingTo.snippet : null
        };

        cancelReply();

        let { data, error } = await supabaseClient
          .from('chat_messages')
          .insert([payload])
          .select()
          .single();

        if (error && error.message && error.message.includes('class_name')) {
          delete payload.class_name;
          const fallback = await supabaseClient.from('chat_messages').insert([payload]).select().single();
          data = fallback.data;
          error = fallback.error;
        }

        if (error) {
          alert('傳送圖片訊息失敗：' + error.message);
          return;
        }

        if (data && !allMessages.some(m => m.id === data.id)) {
          allMessages.push(data);
          renderThreadList();
          renderActiveMessages();
        }
      } catch (err) {
        alert('處理圖片時發生錯誤：' + err.message);
      } finally {
        if (msgInput) {
          msgInput.disabled = false;
          msgInput.placeholder = oldPlaceholder;
        }
      }
    }

    async function handleImageUpload(fileInput) {
      const file = fileInput.files && fileInput.files[0];
      fileInput.value = '';
      if (file) openImagePreviewModal(file);
    }

    async function handlePasteImage(e) {
      const items = (e.clipboardData || window.clipboardData)?.items;
      if (!items) return;
      for (const item of items) {
        if (item.type.indexOf('image') !== -1) {
          e.preventDefault();
          const file = item.getAsFile();
          if (file) openImagePreviewModal(file);
          break;
        }
      }
    }

    async function sendMessage() {
      if (isSending) return;
      if (!isStaffUser && !classSwitches.is_chat_enabled) {
        alert('導師目前已暫停一般訊息發送！');
        return;
      }

      // 安全校驗：一對一私聊對象必須在允許聯絡名單中（學生／家長僅可傳訊給導師或開發者）
      if (activeChannel.type === 'dm') {
        const target = activeChannel.targetUser;
        if (!target || (!isStaffUser && !isStaffProfile(target))) {
          alert('依班級規範，僅可與導師或系統開發者一對一聯絡！');
          return;
        }
      }

      const input = document.getElementById('messageInput');
      if (!input) return;
      const content = input.value.trim();
      if (!content) return;

      isSending = true;
      broadcastTypingState(false);

      const currentReply = replyingTo;
      cancelReply();

      input.value = '';
      localStorage.removeItem(`nexus_draft_${getCurrentChannelKey()}`);
      input.blur();
      requestAnimationFrame(() => {
        input.value = '';
        input.focus();
      });

      const payload = {
        channel_type: activeChannel.type,
        class_name: currentClassName,
        sender_id: me.id,
        sender_name: me.name || '成員',
        sender_seat: me.seat_number ?? null,
        sender_role: me.role,
        receiver_id: activeChannel.type === 'dm' ? activeChannel.targetUser.id : null,
        room_id: activeChannel.type === 'room' ? activeChannel.roomId : null,
        content,
        reply_to_id: currentReply ? currentReply.id : null,
        reply_to_sender: currentReply ? currentReply.sender : null,
        reply_to_content: currentReply ? currentReply.snippet : null
      };

      try {
        let { data, error } = await supabaseClient
          .from('chat_messages')
          .insert([payload])
          .select()
          .single();

        if (error && error.message && error.message.includes('class_name')) {
          delete payload.class_name;
          const fallback = await supabaseClient.from('chat_messages').insert([payload]).select().single();
          data = fallback.data;
          error = fallback.error;
        }

        if (error) {
          alert('傳送失敗：' + error.message);
          input.value = content;
          return;
        }

        if (data && !allMessages.some(m => m.id === data.id)) {
          allMessages.push(data);
          renderThreadList();
          renderActiveMessages();
        }
      } finally {
        isSending = false;
      }
    }

    async function deleteMessage(msgId) {
      if (!confirm('確定要收回 / 刪除此則訊息嗎？')) return;
      const { error } = await supabaseClient
        .from('chat_messages')
        .delete()
        .eq('id', msgId);

      if (error) {
        alert('刪除失敗：' + error.message);
      } else {
        allMessages = allMessages.filter(m => m.id !== msgId);
        renderThreadList();
        renderActiveMessages();
        updatePinnedBannerUI();
      }
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    window.addEventListener('beforeunload', () => {
      if (activeCallState) hangupCall(true);
    });

    init();
  </script>
